version: 2
name: spectrum-agent-registry
purpose: >-
  Registry of specialized SPECTRUM agents, the workflow stages they execute, their
  mandatory and optional Skills, outputs and forbidden decisions. Agents load
  core/agent-brief.md, not this file; the orchestrator uses this registry to
  build Task prompts and to validate returned skill_executions.

agents:
  context-analyst:
    mission: Établir le contexte, les parties prenantes, les entités, les contraintes et les scénarios, puis représenter les exigences et leurs attributs.
    stages: [contextualize, represent_requirements]
    required_skills:
      - requirements-context
      - requirement-relationship-traceability
      - requirement-expression
      - requirements-attribute-management
    optional_skills:
      - elicitation-gap
    outputs:
      - context
      - requirement_representations
      - attribute_observations
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness
      - requirement_quality_verdict

  requirement-analyst:
    mission: Contrôler la qualité des exigences individuelles et des ensembles d'exigences.
    stages: [analyze_requirements]
    required_skills:
      - requirement-statement-quality
      - requirement-set-quality
    optional_skills:
      - elicitation-gap
    outputs:
      - requirement_observations
      - findings
      - evidence_refs
      - missing_context
    forbidden_decisions:
      - global_readiness
      - implementation_choice

  business-rule-analyst:
    mission: Identifier et analyser les règles métier explicites sans inventer leur contenu.
    stages: [analyze_business_rules]
    required_skills:
      - business-rule-analysis
    optional_skills: []
    outputs:
      - rule_assessments
      - findings
      - evidence_refs
      - uncertainties
    forbidden_decisions:
      - global_readiness
      - implementation_choice

  verification-validation-analyst:
    mission: Examiner la vérifiabilité, la validation et la base d'acceptation établie.
    stages: [analyze_verification_validation]
    required_skills:
      - verification-analysis
      - validation-analysis
    optional_skills:
      - requirement-relationship-traceability
    outputs:
      - verification_observations
      - validation_observations
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness

  lifecycle-change-analyst:
    mission: Examiner les relations, attributs, baselines et changements applicables au ticket.
    stages: [analyze_lifecycle_change]
    required_skills:
      - baseline-change-management
      - requirements-attribute-management
      - requirement-relationship-traceability
    optional_skills: []
    outputs:
      - lifecycle_observations
      - change_impact_observations
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness

  adversarial-analyst:
    mission: Mettre les exigences à l'épreuve avec des défis traçables et applicables.
    stages: [analyze_adversarial_requirements]
    required_skills:
      - adversarial-requirement-analysis
    optional_skills:
      - requirements-context
    outputs:
      - challenges
      - observations
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness

  consistency-analyst:
    mission: Comparer plusieurs artefacts sans confondre différence de représentation et contradiction.
    stages: [analyze_cross_artifacts]
    required_skills:
      - cross-artifact-analysis
    optional_skills:
      - requirement-relationship-traceability
    outputs:
      - correspondence_assessments
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness

  implementation-reviewer:
    mission: Examiner les écarts entre spécification fournie et implémentation fournie.
    stages: [analyze_spec_implementation_drift]
    required_skills:
      - spec-implementation-drift-analysis
    optional_skills:
      - cross-artifact-analysis
    outputs:
      - drift_assessments
      - findings
      - evidence_refs
      - limitations
    forbidden_decisions:
      - global_readiness

  independent-reviewer:
    mission: Produire une seconde analyse isolée et comparable avant toute consolidation.
    stages: [analyze_independent]
    required_skills:
      - independent-analysis
    optional_skills:
      - requirement-statement-quality
      - requirement-set-quality
    outputs:
      - independent_analysis
      - comparison
      - divergences
      - evidence_refs
    forbidden_decisions:
      - global_readiness
      - truth_by_agreement

  qa-analyst:
    mission: Déterminer la testabilité et produire les cas de test uniquement à partir du comportement établi, en consommant les résultats amont sans rejouer leurs Skills.
    stages: [qa]
    consumes_outputs_of:
      - verification-validation-analyst
      - adversarial-analyst
      - business-rule-analyst
    required_skills:
      - requirement-relationship-traceability
    optional_skills:
      - verification-analysis
      - validation-analysis
    optional_skills_rule: only when the corresponding upstream result is missing or failed
    outputs:
      - test_cases
      - testability_assessment
      - qa_blockers
      - regression_scope
      - missing_inputs
    forbidden_decisions:
      - global_readiness
      - test_execution_without_permission

  report-composer:
    mission: Transformer les résultats analytiques en rapport utilisateur français et traçable.
    stages: [compose_report]
    required_skills: []
    optional_skills: []
    outputs:
      - user_report
    forbidden_decisions:
      - new_findings_without_evidence
      - readiness_recalculation
      - external_mutation

  # --- Agents dédiés à /spectrum:document-feature (workflows/feature-documentation.yaml) ---
  # Indépendants de /spectrum:analyze-ticket : aucune de ces entrées n'est référencée par
  # un stage de workflows/ticket-analysis.yaml, et aucun agent ci-dessus n'est référencé
  # par un stage de workflows/feature-documentation.yaml.

  architecture-analyst:
    mission: Reconstruire et décrire l'architecture d'une implémentation existante, et en dériver des diagrammes.
    stages: [reconstruct_and_describe_architecture]
    required_skills:
      - architecture-reconstruction
      - architecture-description
      - architecture-diagram
    optional_skills: []
    outputs:
      - architecture_elements
      - architecture_views
      - architecture_decision_records
      - diagrams
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness

  design-documentation-analyst:
    mission: Produire une description de conception logicielle récupérée depuis une implémentation existante.
    stages: [describe_software_design]
    required_skills:
      - software-design-description
    optional_skills: []
    outputs:
      - design_elements
      - design_decisions
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness

  test-documentation-analyst:
    mission: Documenter les preuves de test réellement présentes et leur traçabilité vers les exigences et l'implémentation.
    stages: [document_tests]
    required_skills:
      - test-documentation
    optional_skills:
      - verification-analysis
      - validation-analysis
    optional_skills_rule: only when the corresponding upstream verification/validation basis is missing
    outputs:
      - test_scenarios
      - traceability_chain
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness
      - test_execution_without_permission

  lifecycle-documentation-analyst:
    mission: Consolider par référence les résultats amont en documentation technique canonique, sans réanalyse.
    stages: [structure_lifecycle_documentation]
    consumes_outputs_of:
      - architecture-analyst
      - design-documentation-analyst
      - test-documentation-analyst
    required_skills:
      - lifecycle-documentation
    optional_skills:
      - requirement-relationship-traceability
    outputs:
      - technical_documentation
      - findings
      - evidence_refs
    forbidden_decisions:
      - global_readiness

  documentation-composer:
    mission: Transformer la documentation technique consolidée en document utilisateur français, traçable, prêt pour Confluence.
    stages: [compose_technical_documentation]
    required_skills: []
    optional_skills: []
    outputs:
      - user_document
    forbidden_decisions:
      - global_readiness
      - new_findings_without_evidence
      - readiness_recalculation
      - external_mutation
      - automatic_confluence_publication
