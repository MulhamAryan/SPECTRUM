model: spectrum-multi-source-reasoning
contract_version: 1

invariants:
  - id: MSR-001
    rule: every_source_observation_retains_source_identity_and_provenance
  - id: MSR-002
    rule: every_comparison_has_at_least_two_or_declared_single_source_inputs
  - id: MSR-003
    rule: compatible_observations_remain_individually_traceable
  - id: MSR-004
    rule: contradictions_are_preserved_before_any_resolution
  - id: MSR-005
    rule: source_authority_is_taken_from_canonical_source_metadata
  - id: MSR-006
    rule: authority_is_not_inferred_from_content_or_model_confidence
  - id: MSR-007
    rule: temporal_or_scope_differences_are_distinguished_from_contradiction
  - id: MSR-008
    rule: source_resolution_requires_explicit_policy_or_authorized_authority
  - id: MSR-009
    rule: resolution_does_not_delete_original_source_observations
  - id: MSR-010
    rule: derived_outputs_retain_input_references
  - id: MSR-011
    rule: missing_source_coverage_is_preserved_as_incomplete_or_uncertain
  - id: MSR-012
    rule: multi_source_reasoning_does_not_create_global_readiness_decision

negative_controls:
  - id: MSR-N001
    reject: select_one_source_because_the_model_prefers_it
  - id: MSR-N002
    reject: silently_delete_conflicting_source_claim
  - id: MSR-N003
    reject: treat_newer_source_as_authoritative_without_declared_policy
  - id: MSR-N004
    reject: treat_higher_confidence_as_source_authority
  - id: MSR-N005
    reject: infer_missing_source_content_from_another_source_without_declared_basis
  - id: MSR-N006
    reject: classify_different_scope_or_time_as_direct_contradiction
  - id: MSR-N007
    reject: resolve_conflict_without_traceable_policy_or_authority
  - id: MSR-N008
    reject: lose_provenance_after_source_resolution
  - id: MSR-N009
    reject: create_readiness_decision_from_source_comparison_alone
  - id: MSR-N010
    reject: convert_corrobation_into_single_synthetic_source_fact

acceptance:
  scope: source_observation_comparison_corroboration_contradiction_resolution_provenance_and_decision_boundary
  source_authority: canonical_source_metadata
  readiness_decision: explicitly_out_of_scope
