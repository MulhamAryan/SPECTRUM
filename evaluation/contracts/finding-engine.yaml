engine: spectrum-finding-engine
contract_version: 2

invariants:
  - id: FE-001
    rule: aggregation_has_stable_identity_and_analysis_reference
  - id: FE-002
    rule: all_aggregation_inputs_are_explicitly_referenced
  - id: FE-003
    rule: finding_output_retains_attributable_observation_or_evidence_basis
  - id: FE-004
    rule: every_merge_has_explicit_grouping_basis
  - id: FE-005
    rule: same_target_different_material_basis_is_not_silently_merged
  - id: FE-006
    rule: contradictions_are_preserved_and_traceable
  - id: FE-007
    rule: unresolved_uncertainty_is_preserved
  - id: FE-008
    rule: consolidation_does_not_create_source_facts
  - id: FE-009
    rule: consolidation_does_not_modify_original_evidence_or_observations
  - id: FE-010
    rule: finding_status_and_severity_do_not_become_readiness_decisions
  - id: FE-011
    rule: failed_or_blocked_inputs_remain_visible_in_coverage_or_unresolved_refs
  - id: FE-012
    rule: consolidated_findings_are_distinct_from_decisions
  - id: FE-013
    rule: absence_of_input_does_not_create_nonconformity_finding_without_basis
  - id: FE-014
    rule: resolution_requires_attributable_resolution_input
  - id: FE-015
    rule: identical_input_refs_and_same_basis_are_reproducibly_grouped
  - id: FE-016
    rule: grouping_uses_explicit_target_semantic_scope_and_evidence_basis
  - id: FE-017
    rule: input_order_does_not_change_grouping_or_consolidation_result
  - id: FE-018
    rule: repeated_execution_with_same_revision_is_idempotent
  - id: FE-019
    rule: material_scope_or_temporal_difference_prevents_false_duplicate_merge
  - id: FE-020
    rule: conflict_classification_precedes_any_resolution_or_merge
  - id: FE-021
    rule: resolution_requires_explicit_authority_or_policy_when_inputs_conflict
  - id: FE-022
    rule: displaced_inputs_remain_traceable_after_policy_authorized_resolution

negative_controls:
  - id: FE-N001
    reject: merge_findings_by_title_only
  - id: FE-N002
    reject: merge_findings_by_severity_only
  - id: FE-N003
    reject: discard_lower_severity_finding_without_explicit_policy
  - id: FE-N004
    reject: convert_missing_input_into_positive_or_negative_fact
  - id: FE-N005
    reject: erase_source_or_observation_provenance_after_merge
  - id: FE-N006
    reject: silently_delete_contradictory_finding_after_consolidation
  - id: FE-N007
    reject: convert_uncertainty_into_satisfied_condition_without_new_evidence
  - id: FE-N008
    reject: infer_readiness_from_finding_count_or_severity
  - id: FE-N009
    reject: create_decision_inside_finding_engine
  - id: FE-N010
    reject: resolve_conflict_using_model_preference_or_parseability
  - id: FE-N011
    reject: mark_finding_resolved_without_attributable_resolution_basis
  - id: FE-N012
    reject: mutate_original_evidence_or_observation_objects_during_consolidation
  - id: FE-N013
    reject: merge_non_overlapping_scopes_as_duplicates
  - id: FE-N014
    reject: let_input_arrival_order_change_group_assignment
  - id: FE-N015
    reject: create_duplicate_result_on_idempotent_reexecution
  - id: FE-N016
    reject: resolve_conflicting_findings_without_authorized_basis
  - id: FE-N017
    reject: discard_displaced_source_traceability_after_resolution
  - id: FE-N018
    reject: normalize_away_material_temporal_or_applicability_difference

acceptance:
  scope: finding_grouping_consolidation_deduplication_determinism_idempotency_conflict_preservation_uncertainty_traceability_and_decision_boundary
  readiness_semantics: out_of_scope
  source_semantics: delegated_to_canonical_models_and_source_specific_skills
