model: spectrum-decision-engine
contract_version: 1

invariants:
  - id: DE-001
    rule: decision_request_has_traceable_analysis_result_and_policy
  - id: DE-002
    rule: policy_identity_and_version_are_resolved
  - id: DE-003
    rule: policy_applicability_is_evaluated_before_outcome_criteria
  - id: DE-004
    rule: every_outcome_is_derived_from_explicit_policy_criteria
  - id: DE-005
    rule: missing_inputs_and_uncertainty_are_preserved
  - id: DE-006
    rule: conflicting_inputs_are_preserved_or_resolved_only_by_explicit_policy
  - id: DE-007
    rule: decision_references_evaluation_policy_and_inputs
  - id: DE-008
    rule: finding_severity_does_not_imply_decision_without_policy
  - id: DE-009
    rule: skill_execution_status_does_not_imply_decision
  - id: DE-010
    rule: policy_changes_create_new_policy_versions
  - id: DE-011
    rule: policy_error_does_not_create_fallback_decision
  - id: DE-012
    rule: decision_authority_is_attributable_when_required
  - id: DE-013
    rule: every_applicable_policy_criterion_has_an_attributable_result
  - id: DE-014
    rule: analysis_and_evaluation_statuses_do_not_become_decision_outcomes_by_default
  - id: DE-015
    rule: decision_target_is_within_declared_decision_scope
  - id: DE-016
    rule: decision_requires_policy_permitted_outcome_and_attributable_evaluation
  - id: DE-017
    rule: decision_does_not_modify_findings_or_evidence

negative_controls:
  - id: DE-N001
    reject: create_decision_without_explicit_policy
  - id: DE-N002
    reject: create_decision_from_finding_severity_alone
  - id: DE-N003
    reject: create_decision_from_skill_status_alone
  - id: DE-N004
    reject: invent_missing_policy_threshold_or_outcome
  - id: DE-N005
    reject: silently_resolve_conflicting_evidence
  - id: DE-N006
    reject: use_unversioned_policy
  - id: DE-N007
    reject: create_fallback_decision_after_policy_error
  - id: DE-N008
    reject: lose_traceability_between_decision_evaluation_policy_and_findings
  - id: DE-N009
    reject: create_decision_from_partial_blocked_or_failed_analysis_without_explicit_policy_permission
  - id: DE-N010
    reject: create_decision_from_inconclusive_evaluation_without_explicit_policy_permission
  - id: DE-N011
    reject: treat_evaluation_status_as_decision_status
  - id: DE-N012
    reject: create_decision_outside_declared_scope
  - id: DE-N013
    reject: create_decision_without_attributable_evaluation
  - id: DE-N014
    reject: alter_findings_or_evidence_as_part_of_decision_creation

acceptance:
  scope: decision_request_policy_evaluation_criteria_outcomes_governance_and_traceability
  ticket_readiness_policy: explicitly_out_of_scope
