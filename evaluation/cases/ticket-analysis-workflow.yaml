workflow: ticket-analysis

cases:
  - id: taw-001
    title: minimal_valid_flow
    input: ticket_with_required_inputs_and_versioned_readiness_policy
    expected: workflow_completes_with_traceable_analysis_and_readiness_evaluation
  - id: taw-002
    title: dependency_order
    input: downstream_stage_requested_before_required_upstream_stage
    expected: execution_blocked_until_dependency_exists
  - id: taw-003
    title: parallel_analysis
    input: independent_requirement_verification_and_lifecycle_analysis_stages
    expected: stages_are_eligible_for_parallel_execution
  - id: taw-004
    title: explicit_handoff
    input: context_stage_produces_outputs_consumed_by_requirement_representation
    expected: handoff_records_producer_consumer_and_inputs
  - id: taw-005
    title: missing_source_context
    input: required_context_is_not_established
    expected: uncertainty_or_partial_analysis_preserved
  - id: taw-006
    title: skill_failure_isolation
    input: one_parallel_skill_fails_while_other_skills_succeed
    expected: successful_outputs_preserved_and_failure_recorded
  - id: taw-007
    title: unavailable_skill
    input: selected_skill_is_not_registered_or_contract_cannot_resolve
    expected: stage_blocked_or_partial_with_reason
  - id: taw-008
    title: no_implicit_skill_call
    input: stage_attempts_to_execute_an_undeclared_skill_inside_another_skill
    expected: execution_rejected
  - id: taw-009
    title: analysis_result_before_readiness
    input: readiness_stage_requested_before_analysis_consolidation
    expected: readiness_stage_blocked
  - id: taw-010
    title: missing_readiness_policy
    input: analysis_completes_but_readiness_policy_is_missing
    expected: analysis_preserved_without_readiness_decision
  - id: taw-011
    title: completed_workflow_not_readiness
    input: all_stages_complete_without_readiness_policy_evaluation
    expected: workflow_state_does_not_become_readiness_outcome
  - id: taw-012
    title: partial_analysis
    input: required_analysis_stage_is_partial
    expected: partial_analysis_result_with_coverage_and_uncertainty
  - id: taw-013
    title: readiness_decision
    input: analysis_result_and_explicit_versioned_readiness_policy_are_available
    expected: policy_driven_readiness_evaluation_and_decision
  - id: taw-014
    title: policy_error
    input: readiness_policy_evaluation_fails
    expected: failed_readiness_without_fallback_decision
  - id: taw-015
    title: provenance_preservation
    input: evidence_and_findings_pass_through_multiple_stages
    expected: end_to_end_traceability_preserved
  - id: taw-016
    title: conflict_preservation
    input: parallel_stages_produce_conflicting_findings
    expected: conflict_remains_attributable_and_is_not_silently_merged
  - id: taw-017
    title: terminal_non_success
    input: analysis_result_is_blocked_or_failed
    expected: no_readiness_outcome_without_explicit_policy_permission
  - id: taw-018
    title: reproducibility
    input: same_ticket_revision_and_same_policy_version_are_reexecuted
    expected: workflow_inputs_and_policy_identity_are_reproducible
  - id: taw-019
    title: multi_source_stage_present
    input: workflow_version_2
    expected: explicit_multi_source_reasoning_stage_exists_and_uses_declared_engine
  - id: taw-020
    title: multi_source_before_findings
    input: multi_source_reasoning_and_finding_consolidation_stages
    expected: multi_source_stage_completes_before_finding_consolidation
  - id: taw-021
    title: multi_source_input_handoff
    input: source_and_parallel_analysis_outputs_available
    expected: multi_source_stage_receives_explicit_source_context_and_analysis_refs
  - id: taw-022
    title: source_conflict_through_workflow
    input: conflicting_source_observations_reach_multi_source_reasoning
    expected: conflict_is_preserved_and_traceable_into_findings
  - id: taw-023
    title: finding_consolidation_before_analysis_result
    input: finding_engine_output_and_analysis_result_stage
    expected: finding_consolidation_precedes_final_analysis_result_consolidation
  - id: taw-024
    title: finding_failure_isolation
    input: finding_engine_fails_after_analytical_stages_succeed
    expected: prior_observations_and_findings_are_preserved_and_analysis_is_partial_or_blocked
  - id: taw-025
    title: no_readiness_from_finding_output
    input: finding_engine_produces_multiple_findings
    expected: workflow_does_not_create_readiness_until_explicit_readiness_stage
  - id: taw-026
    title: multi_source_internal_boundary
    input: workflow_receives_internal_multi_source_objects
    expected: only_declared_canonical_outputs_cross_the_model_boundary
  - id: taw-027
    title: cross_artifact_stage_present
    input: workflow_version_3
    expected: explicit_cross_artifact_analysis_stage_exists_and_uses_declared_skill
  - id: taw-028
    title: cross_artifact_before_multi_source
    input: cross_artifact_and_multi_source_stages
    expected: cross_artifact_analysis_completes_before_multi_source_reasoning
  - id: taw-029
    title: cross_artifact_scope_handoff
    input: ticket_with_multiple_related_project_artifacts
    expected: cross_artifact_stage_receives_explicit_artifact_scope_and_relationship_refs
  - id: taw-030
    title: cross_artifact_failure_isolation
    input: cross_artifact_analysis_fails_after_other_analysis_stages_succeed
    expected: prior_outputs_are_preserved_and_cross_artifact_failure_is_visible
  - id: taw-031
    title: cross_artifact_no_direct_readiness
    input: cross_artifact_analysis_produces_high_severity_mismatch
    expected: finding_is_forwarded_without_creating_readiness_decision
