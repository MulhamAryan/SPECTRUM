source:
  id: iso-iec-ieee-29148-2018
  title: ISO/IEC/IEEE 29148:2018
  authority: ISO/IEC/IEEE
  role: normative_reference
  provenance: official_iso_online_browsing_platform
  normative_status: published_standard
  evidence_boundary: public_source_only

purpose:
  statement: >-
    Ce catalogue définit des contrôles SPECTRUM dérivés uniquement d'éléments
    publiquement vérifiables dans l'ISO/IEC/IEEE 29148:2018. Une règle de ce
    fichier est un contrôle produit dérivé et ne constitue pas une citation
    littérale ni une reproduction du texte intégral de la norme.
  distinction:
    normative_source: ISO/IEC/IEEE 29148:2018
    derived_control: SPECTRUM interpretation intended for implementation

rule_schema:
  id: identifiant_stable
  source_section: section_publiquement_verifiee
  basis: fondement_source
  classification: type_de_controle
  applicability: contexte_d_application
  check: controle_observable
  finding: resultat_si_controle_echoue
  adaptation: interpretation_specifique_a_spectrum

rules:
  - id: ISO29148-R001
    source_section: "3.1.19"
    basis: requirement_definition
    classification: derived_control
    applicability: requirement_identification
    check: >-
      Pour traiter un élément comme une exigence, SPECTRUM doit pouvoir
      identifier l'élément d'intérêt auquel elle se rapporte.
    finding: missing_item_of_interest
    adaptation: >-
      Le système signale une cible insuffisamment explicitée au lieu de la
      compléter par inférence non prouvée.

  - id: ISO29148-R002
    source_section: "3.1.19"
    basis: requirement_definition
    classification: derived_control
    applicability: requirement_identification
    check: >-
      L'analyse doit pouvoir distinguer dans le contexte disponible le besoin,
      ainsi que les contraintes et conditions qui lui sont associées lorsqu'elles
      sont pertinentes.
    finding: requirement_context_incomplete
    adaptation: >-
      Les informations explicites sont séparées des informations seulement
      déduites.

  - id: ISO29148-R003
    source_section: "3.1.19"
    basis: requirement_definition
    classification: derived_control
    applicability: requirement_interpretation
    check: >-
      L'énoncé traité comme exigence doit pouvoir être interprété comme une
      expression spécifique, précise et non ambiguë du besoin qu'il traduit.
    finding: requirement_expression_unclear
    adaptation: >-
      Les méthodes concrètes d'évaluation de la qualité seront spécifiées avec
      les référentiels spécialisés ultérieurs, notamment INCOSE GtWR.

  - id: ISO29148-R004
    source_section: "3.1.10"
    basis: derived_requirement_definition
    classification: derived_control
    applicability: requirement_relationship_analysis
    check: >-
      Lorsqu'une exigence est identifiée comme dérivée, SPECTRUM doit pouvoir
      représenter sa relation avec le niveau supérieur dont elle est déduite,
      lorsque cette relation est documentée ou démontrable.
    finding: derived_requirement_relationship_missing
    adaptation: >-
      SPECTRUM ne crée pas artificiellement une exigence parent.

  - id: ISO29148-R005
    source_section: "3.1.23"
    basis: requirements_traceability_definition
    classification: derived_control
    applicability: traceability_analysis
    check: >-
      Lorsqu'une relation de traçabilité est disponible, SPECTRUM doit pouvoir
      représenter le chemin de dérivation vers le haut et/ou d'allocation vers
      le bas.
    finding: traceability_relationship_missing
    adaptation: >-
      La trace conserve sa source et son statut de preuve.

  - id: ISO29148-R006
    source_section: "3.1.24"
    basis: requirements_traceability_matrix_definition
    classification: derived_control
    applicability: traceability_artifact
    check: >-
      Si une matrice de traçabilité est utilisée, SPECTRUM doit pouvoir
      représenter les liens entre exigences et éléments de niveau supérieur ou
      de niveau inférieur pertinents.
    finding: incomplete_traceability_artifact
    adaptation: >-
      L'utilisation d'une matrice est conditionnelle au contexte ; SPECTRUM ne
      transforme pas cette définition en obligation universelle de RTM.

  - id: ISO29148-R007
    source_section: "3.1.20"
    basis: requirements_elicitation_definition
    classification: derived_control
    applicability: context_gap_analysis
    check: >-
      Lorsque les besoins nécessaires à l'analyse ne sont pas identifiés dans
      les sources disponibles, SPECTRUM doit pouvoir signaler qu'une activité
      d'élicitation ou de collecte supplémentaire peut être nécessaire.
    finding: elicitation_gap
    adaptation: >-
      Le système signale une lacune ; il ne fabrique pas le besoin manquant.

  - id: ISO29148-R008
    source_section: "3.1.25, 3.1.36"
    basis: requirements_validation_and_validation_definition
    classification: derived_control
    applicability: validation_analysis
    check: >-
      Lorsqu'une validation est revendiquée, SPECTRUM doit pouvoir identifier
      la base permettant de juger que les exigences correspondent au bon système
      et à l'utilisation prévue, avec les éléments de preuve disponibles.
    finding: validation_basis_unavailable
    adaptation: >-
      Le contrôle distingue la validation des exigences de la simple vérification
      de leur forme.

  - id: ISO29148-R009
    source_section: "3.1.26, 3.1.37"
    basis: requirements_verification_and_verification_definition
    classification: derived_control
    applicability: verification_analysis
    check: >-
      Lorsqu'une vérification est revendiquée, SPECTRUM doit pouvoir identifier
      les exigences considérées et la preuve objective disponible permettant de
      confirmer leur satisfaction ou leur bonne formation selon le contexte.
    finding: verification_basis_unavailable
    adaptation: >-
      Le critère à examiner et la preuve sont représentés séparément.

  - id: ISO29148-R010
    source_section: "3.1.21"
    basis: requirements_engineering_definition
    classification: derived_control
    applicability: analysis_scope
    check: >-
      L'analyse SPECTRUM doit être capable de couvrir, selon le contexte, les
      activités de découverte, élicitation, développement, analyse,
      vérification, validation, communication, documentation et gestion des
      exigences.
    finding: requirements_engineering_coverage_gap
    adaptation: >-
      Il s'agit d'une capacité attendue du produit, pas d'un workflow imposé à
      tous les tickets.

  - id: ISO29148-R011
    source_section: "3.1.22"
    basis: requirements_management_definition
    classification: derived_control
    applicability: lifecycle_context
    check: >-
      Lorsque des exigences sont gérées dans le temps, SPECTRUM doit pouvoir
      représenter leur identification, documentation, maintien, communication,
      traçabilité et suivi lorsque ces informations sont disponibles.
    finding: requirements_management_context_gap
    adaptation: >-
      L'outil n'assume pas qu'un ticket Jira constitue à lui seul l'ensemble du
      système de gestion des exigences.

  - id: ISO29148-R012
    source_section: "3.1.17"
    basis: operational_scenario_definition
    classification: derived_control
    applicability: scenario_context_analysis
    check: >-
      Lorsqu'un scénario opérationnel est nécessaire au contexte du ticket,
      SPECTRUM doit pouvoir rechercher ou signaler l'absence de ce scénario dans
      les sources autorisées.
    finding: operational_scenario_context_gap
    adaptation: >-
      L'absence d'un scénario n'est signalée que lorsque le contexte établi le
      rend pertinent.

  - id: ISO29148-R013
    source_section: "3.1.6, 3.1.7, 3.1.30"
    basis: condition_constraint_state_definitions
    classification: derived_control
    applicability: requirement_context_analysis
    check: >-
      Les conditions, contraintes et états pertinents doivent rester
      distinguables dans la représentation SPECTRUM lorsqu'ils sont nécessaires
      à l'interprétation ou à la vérification de l'exigence.
    finding: condition_constraint_state_unclear
    adaptation: >-
      Ces éléments sont modélisés séparément lorsqu'ils sont identifiés avec une
      preuve suffisante.

  - id: ISO29148-R014
    source_section: "3.1.28"
    basis: stakeholder_definition
    classification: derived_control
    applicability: stakeholder_context_analysis
    check: >-
      Lorsque des besoins, attentes ou décisions de parties prenantes sont
      nécessaires pour interpréter l'exigence, les parties prenantes pertinentes
      doivent pouvoir être identifiées à partir des sources disponibles.
    finding: stakeholder_context_gap
    adaptation: >-
      Un nom découvert dans un ticket n'est pas automatiquement transformé en
      rôle de partie prenante sans élément corroborant.

  - id: ISO29148-R015
    source_section: "3.1.29, 3.1.33"
    basis: stakeholder_and_system_requirements_specification_definitions
    classification: derived_control
    applicability: requirement_level_analysis
    check: >-
      Lorsque le niveau de l'exigence est pertinent pour l'analyse, SPECTRUM
      doit pouvoir distinguer le niveau de spécification concerné au lieu de
      traiter tous les énoncés du ticket comme un même niveau d'exigence.
    finding: requirement_level_unclear
    adaptation: >-
      Le niveau est un attribut du modèle SPECTRUM et n'est pas déduit du seul
      fait qu'un contenu provient de Jira.

  - id: ISO29148-R016
    source_section: "1, 5, 6, 7, 8"
    basis: scope_concepts_processes_information_items
    classification: derived_control
    applicability: ticket_readiness_analysis
    check: >-
      Lorsque les informations nécessaires ne sont pas contenues dans le ticket,
      SPECTRUM doit pouvoir rechercher le contexte pertinent dans les autres
      sources autorisées avant de conclure qu'une information manque.
    finding: context_not_sufficiently_established
    adaptation: >-
      Cette règle fonde l'architecture multi-sources du produit ; elle ne
      prescrit pas que Jira, Git ou Confluence soient obligatoires dans tous les
      projets.

  - id: ISO29148-R017
    source_section: "4.1-4.5"
    basis: conformance_structure
    classification: governance_control
    applicability: SPECTRUM_conformance_claims
    check: >-
      Toute affirmation de conformité de SPECTRUM à la norme doit préciser son
      périmètre, son mode de conformité visé et ses éléments de preuve ; une
      simple implémentation de contrôles sélectionnés ne suffit pas à elle seule
      à établir une conformité formelle.
    finding: unsupported_conformance_claim
    adaptation: >-
      SPECTRUM sépare l'utilisation de pratiques issues de la norme d'une
      éventuelle future évaluation de conformité.

exclusions:
  - id: ISO29148-X001
    subject: readiness_statuses
    statement: >-
      READY, READY WITH INVESTIGATION et NOT READY/BLOCKED sont des décisions
      produit SPECTRUM et ne sont pas présentées comme des catégories ISO.
  - id: ISO29148-X002
    subject: INCOSE_quality_characteristics
    statement: >-
      Les critères de qualité détaillés C1-C14 proviennent de l'INCOSE Guide to
      Writing Requirements v4 et seront traités dans le référentiel INCOSE
      séparé.
  - id: ISO29148-X003
    subject: agent_platforms
    statement: >-
      Les mécanismes propres à Claude Code, Codex, Gemini CLI ou à d'autres
      plateformes ne sont pas des règles dérivées d'ISO 29148.

coverage:
  status: bounded_public_source
  standard_text_coverage: not_exhaustive
  reason: >-
    La page ISO rend publiquement consultables la structure, les définitions et
    certaines informations de présentation, mais indique que seul le contenu
    informatif est disponible en ligne et que le texte complet doit être acheté.
  review_requirement: >-
    Si le texte sous licence devient disponible pour SPECTRUM, ce catalogue doit
    être ré-audité section par section avant toute affirmation de couverture
    exhaustive.
