name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pyyaml
      - name: Structural validation (schemas, DAG, orphans, registry/workflow consistency)
        run: python3 scripts/validate.py
      - name: Read-only guard self-test
        run: bash scripts/test-guard.sh
      - name: Version sync check
        run: python3 scripts/sync-version.py --check
