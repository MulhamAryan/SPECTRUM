source:
  id: incose-gtwr-v4-2023
  title: INCOSE Guide to Writing Requirements
  document_number: INCOSE-TP-2010-006-04
  version: 4
  revision: 4
  publication_date: 2023-07-01
  authority: INCOSE Requirements Working Group
  source_basis: official_incose_publication
  companion_source:
    id: gtwr-v4-summary-sheet
    title: INCOSE Guide to Writing Requirements v4 - Summary Sheet
    document_number: INCOSE-TP-2010-006-04
    date: 2023-06
    pages: 7
    source_basis: official_incose_publication

phase:
  number: 2
  name: structured_knowledge_extraction
  status: completed
  objective: >-
    Maintain a source-faithful, auditable index of the structured INCOSE GtWR
    knowledge without reproducing the copyrighted full Guide.

canonical_artifacts:
  definitions: definitions.yaml
  characteristics: characteristics.yaml
  rules: rules.yaml
  attributes: attributes.yaml
  matrices: matrices.yaml

source_hierarchy:
  primary:
    - gtwr-v4-full
  companion:
    - gtwr-v4-summary-sheet
  supporting_official_sources_are_separate: true

integrity_requirements:
  - Only official INCOSE publications are authoritative source evidence.
  - Source facts and SPECTRUM-derived behavior must remain distinguishable.
  - Every extracted element must retain source identity and location when verified.
  - The published Rule-to-Characteristic matrix must not be inferred from rule names.
  - The published NRM Concepts and Activities-to-Characteristic matrix must not be inferred.
  - Attribute names are inventoried from the GtWR Summary Sheet; detailed attribute semantics belong to the NRM and are not silently reconstructed here.
  - No AI-generated summary is accepted as source evidence.

coverage:
  definitions: complete_with_source_locations
  characteristics: C1-C15_structured
  rules: R1-R42_structured
  attributes: A1-A49_inventory_structured
  rules_to_characteristics_matrix: transcribed
  nrm_concepts_activities_to_characteristics_matrix: transcribed
  attributes_to_characteristics_matrix: transcribed

known_source_discrepancy:
  rule: R14
  canonical_rule_name: Correct Punctuation
  detailed_source_basis: "GtWR v4 section 4.3.3; Summary Sheet page 3"
  conflicting_matrix_label: "Correct Condition"
  conflicting_source_location: "Summary Sheet page 4 cross-reference matrix"
  handling: >-
    Preserve the discrepancy between official source locations. Use the detailed
    GtWR rule definition as the canonical rule identity; do not silently replace
    the matrix label.

phase_2_exit_criteria:
  - official_source_identity_preserved
  - definitions_structured_and_source_located
  - C1_C15_structured
  - R1_R42_structured
  - A1_A49_inventory_structured
  - rules_to_characteristics_cells_transcribed
  - nrm_concepts_activities_to_characteristics_cells_transcribed
  - attributes_to_characteristics_cells_transcribed
  - official_source_discrepancies_explicitly_preserved
  - no_spectrum_behavior_mixed_into_source_knowledge

out_of_scope_requires_nrm:
  - detailed_semantic_definitions_of_A1_A49
  - NRM_Section_15_attribute_guidance
  note: >-
    The GtWR Summary Sheet explicitly directs readers to the NRM for detailed
    attribute descriptions. Such content belongs in a separate NRM knowledge
    baseline rather than being fabricated or inferred in the GtWR source set.

copyright:
  full_guide: protected
  summary_sheet: official_summary_with_attribution_permission
  repository_policy: >-
    Store structured knowledge and concise paraphrases with attribution; do not
    reproduce the full copyrighted Guide.

source_reference:
  official_summary_sheet: https://www.incose.org/docs/default-source/working-groups/requirements-wg/guidetowritingrequirements/incose_rwg_gtwr_v4_summary_sheet.pdf
  official_gtwr_v4: https://www.incose.org/docs/default-source/working-groups/requirements-wg/gtwr/incose_rwg_gtwr_v4_040423_final_drafts.pdf

next_phase:
  number: 3
  name: incose_controls_and_skills
  prerequisite: phase_2_exit_criteria_passed
