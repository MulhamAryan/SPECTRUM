phase:
  number: 2
  name: structured_knowledge_extraction
  status: in_progress
  objective: >-
    Structure the official GtWR v4 characteristics, writing rules, attributes,
    and published cross-reference relationships without reproducing the full
    copyrighted Guide.
  source_rule: >-
    Only official INCOSE publications are authoritative for this extraction.
    Secondary sources and model-generated interpretations are not source
    evidence.

interpretation_boundary:
  source_fact: >-
    A fact directly identifiable in an official INCOSE publication.
  structured_knowledge: >-
    A faithful structured representation or concise paraphrase of a source fact.
  spectrum_derived_control: >-
    A later SPECTRUM implementation decision derived from the structured source.
  spectrum_skill_behavior: >-
    A later operational behavior assigned to a SPECTRUM Skill.
  prohibition: >-
    This file must not be used to present SPECTRUM implementation decisions as
    INCOSE requirements.

characteristics:
  individual_needs_and_requirements:
    source_section: "Characteristics"
    characteristics:
      - id: C1
        name: Necessary
        basis: formal_transformation
        summary: >-
          The statement represents capability, characteristic, constraint, or
          quality factor needed to satisfy its applicable source, concept, need,
          or higher-level requirement.
      - id: C2
        name: Appropriate
        basis: formal_transformation
        summary: >-
          The intent and level of detail are appropriate to the abstraction,
          organization, or architecture level of the addressed entity.
      - id: C3
        name: Unambiguous
        basis: agreed_to_obligation
        summary: >-
          The intended meaning is clear and interpretable in only one way by
          the intended audiences.
      - id: C4
        name: Complete
        basis: agreed_to_obligation
        summary: >-
          The statement sufficiently describes the necessary capability,
          characteristic, constraint, conditions, or quality factor needed for
          its applicable source, need, or higher-level requirement.
      - id: C5
        name: Singular
        basis: formal_transformation
        summary: >-
          The statement expresses a single capability, characteristic,
          constraint, or quality factor.
      - id: C6
        name: Feasible
        basis: agreed_to_obligation
        summary: >-
          The need or requirement can be realized within relevant entity
          constraints with acceptable risk.
      - id: C7
        name: Verifiable
        basis: agreed_to_obligation
        summary: >-
          The statement is structured and worded so realization can be checked
          to the approving authority's satisfaction using appropriate evidence.
      - id: C8
        name: Correct
        basis: formal_transformation
        summary: >-
          The statement accurately represents the lifecycle concept, source,
          need, or higher-level requirement from which it was transformed.
      - id: C9
        name: Conforming
        basis: formal_transformation
        summary: >-
          The statement conforms to an approved pattern and applicable style
          guide or standard for writing and managing needs and requirements.
  sets_of_needs_and_requirements:
    source_section: "Characteristics"
    characteristics:
      - id: C10
        name: Complete
        basis: formal_transformation
        summary: >-
          The set stands alone at the appropriate abstraction level and
          sufficiently covers the relevant capabilities, characteristics,
          functionality, performance, drivers, constraints, conditions,
          interactions, standards, regulations, safety, security, resilience,
          and quality factors.
      - id: C11
        name: Consistent
        basis: formal_transformation
        summary: >-
          The set is internally coherent: individual items are unique, do not
          conflict or overlap, use homogeneous units and measurement systems,
          and use consistent language aligned with the project ontology,
          architectural model, glossary, and data dictionary.
      - id: C12
        name: Feasible
        basis: agreed_to_obligation
        summary: >-
          The set can be realized within relevant entity constraints with
          acceptable risk.
      - id: C13
        name: Comprehensible
        basis: agreed_to_obligation
        summary: >-
          The set is written so what is expected of the entity and its relation
          to the macro system are clear.
      - id: C14
        name: Able to be validated
        basis: agreed_to_obligation
        summary: >-
          It is possible to validate that the set supports the intended product
          goals, objectives, stakeholder expectations, risks, lifecycle concepts
          or higher-level needs within applicable constraints and acceptable
          risk.
      - id: C15
        name: Correct
        basis: formal_transformation
        summary: >-
          The set accurately represents the lifecycle concepts, sources, needs,
          or higher-level requirements from which it was transformed.

rules:
  source_section: "Rules for Need and Requirement Statements and Sets of Needs and Requirements"
  note: >-
    The summaries below are concise structured paraphrases of the official
    Summary Sheet rule statements. They are not reproduced source text.
  groups:
    - name: Accuracy
      rules:
        - id: R1
          name: Structured Statements
          summary: Use one agreed pattern that yields a well-structured, complete statement.
        - id: R2
          name: Active Voice
          summary: Identify the responsible entity as the grammatical subject and use active voice.
        - id: R3
          name: Appropriate Subject-Verb
          summary: Use a subject and verb appropriate to the addressed entity.
        - id: R4
          name: Defined Terms
          summary: Terms used in statements are defined in an associated glossary or data dictionary.
        - id: R5
          name: Definite Articles
          summary: Prefer the definite article for identified entities rather than an indefinite article.
        - id: R6
          name: Common Units of Measure
          summary: Quantities use explicit, appropriate, consistent units from a common measurement system.
        - id: R7
          name: Vague Terms
          summary: Avoid vague quantification and vague qualitative adjectives.
        - id: R8
          name: Escape Clauses
          summary: Avoid clauses that defer applicability or obligation through vague conditional language.
        - id: R9
          name: Open-Ended Clauses
          summary: Avoid open-ended non-specific constructions that leave the set of cases undefined.
    - name: Concision
      rules:
        - id: R10
          name: Superfluous Infinitives
          summary: Remove unnecessary infinitive constructions that add no requirement meaning.
        - id: R11
          name: Separate Clauses
          summary: Use separate clauses for separate conditions or qualifications.
    - name: Non-ambiguity
      rules:
        - id: R12
          name: Correct Grammar
          summary: Use grammatically correct requirement statements.
        - id: R13
          name: Correct Spelling
          summary: Use correct spelling.
        - id: R14
          name: Correct Punctuation
          summary: Use correct punctuation.
        - id: R15
          name: Logical Expressions
          summary: Use a defined convention for AND, OR, XOR, NOT and similar logical expressions.
        - id: R16
          name: Use of Not
          summary: Avoid negating requirements with the word not when it creates avoidable ambiguity.
        - id: R17
          name: Use of Oblique Symbol
          summary: Avoid slash notation except for permitted units or fractions.
    - name: Singularity
      rules:
        - id: R18
          name: Single Thought Sentence
          summary: Keep one sentence focused on one thought, with relevant conditioning or qualification.
        - id: R19
          name: Combinators
          summary: Avoid words that combine separate clauses or thoughts into one requirement.
        - id: R20
          name: Purpose Phrases
          summary: Avoid embedding purpose, intent, or reason in the requirement statement.
        - id: R21
          name: Parentheses
          summary: Avoid subordinate text embedded in parentheses or brackets.
        - id: R22
          name: Enumeration
          summary: Enumerate explicit sets rather than hiding multiple items behind a group noun.
        - id: R23
          name: Supporting Diagram, Model or ICD
          summary: Reference an appropriate supporting model, diagram, or interface control document for complex behavior.
    - name: Completeness
      rules:
        - id: R24
          name: Pronouns
          summary: Avoid personal and indefinite pronouns that obscure the referenced entity.
        - id: R25
          name: Headings
          summary: Do not rely on headings to supply essential meaning omitted from the statement.
    - name: Realism
      rules:
        - id: R26
          name: Absolutes
          summary: Avoid unachievable absolute claims such as universal or perfect performance.
    - name: Conditions
      rules:
        - id: R27
          name: Explicit Conditions
          summary: State condition applicability explicitly rather than leaving it to inference.
        - id: R28
          name: Multiple Conditions
          summary: Express the logical relationship between multiple conditions explicitly.
    - name: Uniqueness
      rules:
        - id: R29
          name: Classification
          summary: Classify needs and requirements according to the aspects of the problem or system addressed.
        - id: R30
          name: Unique Expression
          summary: Express each need or requirement once and only once.
    - name: Abstraction
      rules:
        - id: R31
          name: Solution Free
          summary: Keep needs and requirements free of implementation unless there is an explicit rationale to constrain design.
    - name: Quantifiers
      rules:
        - id: R32
          name: Universal Qualification
          summary: Use the defined universal qualifier when universal quantification is intended.
    - name: Tolerance
      rules:
        - id: R33
          name: Range of Values
          summary: Define a quantity with an appropriate range against which it can be verified or validated.
    - name: Quantification
      rules:
        - id: R34
          name: Measurable Performance
          summary: Specify measurable performance targets appropriate to the addressed entity and verification context.
        - id: R35
          name: Temporal Dependencies
          summary: Define temporal dependencies explicitly rather than leaving them to indefinite temporal terms.
    - name: Uniformity of Language
      rules:
        - id: R36
          name: Consistent Terms and Units
          summary: Keep terminology and measurement units consistent with the project's defined ontology across lifecycle artifacts.
        - id: R37
          name: Acronyms
          summary: Use acronyms consistently across the requirement set and associated lifecycle artifacts.
        - id: R38
          name: Abbreviations
          summary: Avoid abbreviations in needs and requirement statements and associated lifecycle artifacts.
        - id: R39
          name: Style Guide
          summary: Apply a project-wide style guide to individual need and requirement statements.
        - id: R40
          name: Decimal Format
          summary: Use a consistent decimal format and number of significant digits.
    - name: Modularity
      rules:
        - id: R41
          name: Related Needs and Requirements
          summary: Group related needs and requirements together.
        - id: R42
          name: Structured Sets
          summary: Organize requirement sets using a defined structure or template.

