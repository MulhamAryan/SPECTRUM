copyright:
  status: protected_source
  repository_policy: >-
    Store metadata, structured inventories, and concise paraphrases with
    attribution and provenance. Do not reproduce the full copyrighted Guide.
  official_summary_permission: >-
    The official Summary Sheet states that reproduction and derivative works
    are permitted with attribution and inclusion of its copyright notice.
  attribution_required: true

phase_2_exit_status:
  status: partially_complete
  reason: >-
    The characteristics, rules, attributes, and official matrix inventory are
    now structured from authoritative INCOSE material. Controlled cell-level
    transcription of the published cross-reference matrices remains a separate
    verification task before Phase 2 is declared complete.
  next_verification_task: >-
    Verify each matrix cell directly against the official Summary Sheet before
    using any relationship to derive SPECTRUM rules or Skills.
