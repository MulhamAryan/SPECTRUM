cross_references:
  rules_to_characteristics:
    source: gtwr-v4-summary-sheet
    location: "page 4"
    status: source_verified
    note: >-
      The official Summary Sheet publishes the complete Rule-to-Characteristic
      cross-reference matrix. The matrix is retained as a distinct source
      relationship and must not be inferred from rule group names.
  nrm_concepts_and_activities_to_characteristics:
    source: gtwr-v4-summary-sheet
    location: "pages 5-6"
    status: source_verified
    note: >-
      The official Summary Sheet publishes a second matrix connecting NRM
      concepts and activities to C1-C15. This relationship is intentionally
      kept distinct from the writing-rule matrix because INCOSE states that the
      characteristics also depend on underlying analysis and maturation of
      knowledge.
  attributes_to_characteristics:
    source: gtwr-v4-full-and-summary
    status: source_verified
    note: >-
      The full GtWR and the official Summary Sheet publish an Attributes-to-
      Characteristics cross-reference matrix. The detailed cell mapping is
      reserved for a controlled extraction step rather than being reconstructed
      from attribute names.

