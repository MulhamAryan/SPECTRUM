source:
  id: incose-gtwr-v4-2023
  basis: official_incose_publication
  companion: gtwr-v4-summary-sheet
  source_version: "v4 / Rev 4"

phase: 2
status: controlled_extraction

purpose: >-
  Record the foundational GtWR v4 terminology needed to interpret C1-C15,
  R1-R42, and A1-A49. These entries are concise structured paraphrases, not
  reproduction of the copyrighted source text.

scope:
  applies_to:
    - entities
    - concepts
    - needs
    - requirements
    - need_requirement_patterns
    - needs_sets
    - requirement_sets
    - attributes
    - need_expressions
    - requirement_expressions
  source_family: INCOSE Guide to Writing Requirements v4

terms:
  - id: entity
    source_label: Entity
    summary: >-
      A single addressed item to which a concept, need, or requirement applies;
      the source examples include organizational, project, service, process,
      system, product, and stakeholder-class entities.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: concept
    source_label: Concept
    summary: >-
      A textual or graphical representation of how an entity can address the
      problem, threat, or opportunity it was defined to address, within stated
      constraints and acceptable risk.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: lifecycle_concept
    source_label: Set of Lifecycle Concepts
    summary: >-
      Multiple concepts covering the lifecycle activities and how the
      organization and stakeholders expect to manage, acquire, define, develop,
      build, integrate, verify, validate, transition, operate, support,
      maintain, and retire an entity.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: need_statement
    source_label: Need Statement
    summary: >-
      The result of formally transforming one or more sources or lifecycle
      concepts into an agreed expectation for an entity to perform a function
      or possess a quality within stated constraints and acceptable risk.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: requirement_statement
    source_label: Requirement Statement
    summary: >-
      The result of formally transforming one or more sources, needs, or
      higher-level requirements into an agreed obligation for an entity to
      perform a function or possess a quality within stated constraints and
      acceptable risk.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: need_requirement_pattern
    source_label: Requirement Pattern / Need Pattern
    summary: >-
      A series of building blocks or pattern slots representing the elements
      needed for a well-formed, singular, and complete need or requirement.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: need_set
    source_label: Need Set
    summary: >-
      A structured set of agreed-to need expressions for an entity and its
      external interfaces; within the cited INCOSE product family this is called
      an Integrated Set of Needs.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: requirement_set
    source_label: Requirement Set
    summary: >-
      A structured set of agreed-to requirement expressions for an entity and
      its external interfaces; within the cited INCOSE product family this is
      called a set of system Design Input Requirements.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: attribute
    source_label: Attribute
    summary: >-
      Additional information associated with an entity that supports its
      definition, understanding, and management.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: need_expression
    source_label: Need Expression
    summary: >-
      A need statement together with its associated set of attributes.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

  - id: requirement_expression
    source_label: Requirement Expression
    summary: >-
      A requirement statement together with its associated set of attributes.
    source_location: "GtWR v4 Summary Sheet page 1"
    interpretation_level: structured_knowledge

provenance_contract:
  every_term_records:
    - source_id
    - source_label
    - source_version
    - source_location
    - interpretation_level

interpretation_boundary:
  source_fact: >-
    A structured representation supported by an identified official INCOSE
    publication.
  derived_behavior: >-
    Machine-checking procedures, Skills, and other SPECTRUM behavior are not
    source facts and are deferred to later phases.
  no_ai_source: true

next_extraction:
  - verify_attribute_to_characteristic_relationships_from_authorized_NRM_material
  - final_summary_sheet_comparison
