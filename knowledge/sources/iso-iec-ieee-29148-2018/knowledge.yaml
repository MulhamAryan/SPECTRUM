information_items:
  source_section: 7
  role: information_model_reference
  applies_to_spectrum: true
  principle: >-
    Requirements engineering produces identifiable information items. SPECTRUM
    should therefore distinguish requirements from the other artifacts and keep
    source identity and provenance explicit.

