implementation_constraints:
  - id: provenance_required
    statement: >-
      Every knowledge element derived from the standard must retain source
      identity and, where verified, source section.
  - id: no_normative_invention
    statement: >-
      SPECTRUM must not present a product interpretation as an ISO requirement.
  - id: no_copyright_reproduction
    statement: >-
      Do not reproduce the copyrighted standard in the repository.
  - id: version_control
    statement: >-
      The source version must remain explicit so a future ISO edition can be
      mapped separately.
  - id: public_source_boundary
    statement: >-
      Publicly visible ISO material is insufficient to claim exhaustive
      coverage of the complete standard text.
  - id: conformance_claim_control
    statement: >-
      Implementation of selected requirements-engineering practices must not be
      represented as formal standard conformance without an explicit assessment.
