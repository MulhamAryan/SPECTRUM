source:
  id: iso-iec-ieee-29148-2018
  role: normative_reference
  rule_catalog: rules/sources/iso-iec-ieee-29148-2018/rules.yaml
  step: "2.5"

skill_design:
  objective: >-
    Transformer les contrôles ISO 29148 déjà validés en capacités analytiques
    SPECTRUM composables, sans transformer ces contrôles en nouvelles exigences
    normatives et sans perdre la traçabilité vers les règles.
  types:
    component: analyse spécialisée réutilisable
    interactive: réduction d'une incertitude ou choix d'une voie d'analyse
    workflow: orchestration de Skills spécialisés

skills:
  - id: SPECTRUM-SK-REQ-CONTEXT
    name: requirement-context
    type: component
    role: requirement_analysis
    trigger: >-
      Activer lorsqu'un ticket ou une exigence doit être interprété par rapport
      à son sujet, son niveau, son besoin, ses contraintes, ses conditions ou ses états.
    objective: >-
      Établir ce qui est explicitement identifiable dans l'exigence et son
      contexte immédiat avant toute conclusion de qualité ou de readiness.
    scope:
      includes:
        - identification de l'item d'intérêt
        - distinction besoin / contrainte / condition / état lorsqu'applicable
        - identification du niveau de spécification lorsqu'il est pertinent
      excludes:
        - invention d'un item d'intérêt absent
        - jugement final READY / NOT READY
    inputs:
      required: [ticket, available_context]
      optional: [prior_findings, prior_decisions]
    preconditions: [ticket_or_requirement_available]
    operations:
      - identify_item_of_interest
      - identify_requirement_context
      - distinguish_conditions_constraints_states
      - determine_requirement_level_when_relevant
    rule_refs: [ISO29148-R001, ISO29148-R002, ISO29148-R013, ISO29148-R015]
    outputs: [requirement_context, requirement_level_observation, findings]
    findings:
      - missing_item_of_interest
      - requirement_context_incomplete
      - condition_constraint_state_unclear
      - requirement_level_unclear
    evidence_requirements: >-
      Chaque affirmation factuelle doit pointer vers une source ou être marquée
      comme information non établie.
    dependencies: []
    relations:
      feeds: [SPECTRUM-SK-ELICITATION-GAP, SPECTRUM-SK-RELATIONSHIP-TRACEABILITY]
    exit_conditions: [completed, completed_with_gaps, not_applicable]
    non_goals: [no_requirement_invention, no_formal_conformance_claim]
    evaluation_refs: [nominal, missing_context, not_applicable, regression]

  - id: SPECTRUM-SK-ELICITATION-GAP
    name: elicitation-gap
    type: component
    role: contextualization
    trigger: >-
      Activer lorsqu'une analyse dépend d'un besoin ou d'une information qui
      n'est pas établi dans les sources actuellement disponibles.
    objective: >-
      Identifier les lacunes nécessitant clarification, élicitation ou collecte
      supplémentaire sans fabriquer le contenu manquant.
    scope:
      includes:
        - détection des besoins nécessaires mais non établis
        - formulation d'un gap exploitable
        - indication de la collecte nécessaire
      excludes:
        - réalisation de l'élicitation elle-même
        - invention d'une réponse au gap
    inputs:
      required: [requirement_context, available_sources]
      optional: [prior_findings]
    preconditions: [requirement_context_available]
    operations:
      - detect_unestablished_required_information
      - classify_gap
      - state_required_follow_up
    rule_refs: [ISO29148-R007]
    outputs: [elicitation_gap, findings]
    findings: [elicitation_gap]
    evidence_requirements: source_refs_for_missing_information_assessment
    dependencies: [SPECTRUM-SK-REQ-CONTEXT]
    relations:
      validates: [SPECTRUM-SK-REQ-CONTEXT]
      feeds: [SPECTRUM-WF-ISO29148-READINESS]
    exit_conditions: [completed, not_applicable, blocked_on_missing_context]
    non_goals: [no_gap_filling_by_inference]
    evaluation_refs: [missing_context, evidence_insufficient, regression]

  - id: SPECTRUM-SK-STK-SCENARIO
    name: stakeholder-scenario-context
    type: component
    role: contextualization
    trigger: >-
      Activer lorsque l'interprétation d'une exigence dépend des acteurs,
      parties prenantes, utilisateurs ou scénarios opérationnels pertinents.
    objective: >-
      Établir les parties prenantes et scénarios pertinents à partir des sources
      autorisées et signaler les contextes manquants.
    scope:
      includes:
        - identification des stakeholders pertinents
        - analyse de scénarios opérationnels nécessaires
      excludes:
        - déduction d'un rôle à partir d'un nom seul
        - invention de scénario absent
    inputs:
      required: [ticket, available_context]
      optional: [repository_evidence, prior_findings]
    preconditions: [available_context_accessible]
    operations:
      - identify_relevant_stakeholders
      - determine_operational_scenario_relevance
      - detect_missing_context
    rule_refs: [ISO29148-R012, ISO29148-R014]
    outputs: [stakeholder_context, scenario_context, findings]
    findings: [stakeholder_context_gap, operational_scenario_context_gap]
    evidence_requirements: source_refs_for_stakeholder_and_scenario_claims
    dependencies: [SPECTRUM-SK-REQ-CONTEXT]
    relations:
      feeds: [SPECTRUM-SK-VALIDATION, SPECTRUM-WF-ISO29148-READINESS]
    exit_conditions: [completed, completed_with_gaps, not_applicable]
    non_goals: [no_role_invention, no_scenario_invention]
    evaluation_refs: [nominal, missing_context, not_applicable, regression]

  - id: SPECTRUM-SK-REQUIREMENT-EXPRESSION
    name: requirement-expression-analysis
    type: component
    role: quality_analysis
    trigger: >-
      Activer lorsqu'un ticket ou une exigence contient une formulation
      normative qui doit être examinée pour sa spécificité, sa précision ou
      son absence d'ambiguïté.
    objective: >-
      Examiner l'expression de l'exigence et signaler les formulations qui ne
      sont pas suffisamment spécifiques, précises ou non ambiguës pour être
      interprétées de manière stable.
    scope:
      includes:
        - analyse de la spécificité de la formulation
        - analyse de la précision de la formulation
        - détection d'ambiguïtés ou d'interprétations concurrentes
      excludes:
        - réécriture automatique imposée de l'exigence
        - décision finale READY / NOT READY
        - invention du contenu métier attendu
    inputs:
      required: [requirement]
      optional: [requirement_context, available_context, prior_findings]
    preconditions: [requirement_expression_available]
    operations:
      - assess_requirement_specificity
      - assess_requirement_precision
      - detect_ambiguity
      - report_expression_quality_findings
    rule_refs: [ISO29148-R003]
    outputs: [requirement_expression_observation, findings]
    findings: [requirement_expression_unclear]
    evidence_requirements: source_ref_for_requirement_text_and_supporting_context
    dependencies: [SPECTRUM-SK-REQ-CONTEXT]
    relations:
      feeds: [SPECTRUM-SK-VERIFICATION, SPECTRUM-WF-ISO29148-READINESS]
    exit_conditions: [completed, completed_with_gaps, not_applicable]
    non_goals: [no_invented_requirement_content, no_final_readiness_decision]
    evaluation_refs: [nominal, missing_context, contradictory_context, insufficient_evidence, regression]

  - id: SPECTRUM-SK-RELATIONSHIP-TRACEABILITY
    name: requirement-relationship-traceability
    type: component
    role: relationship_traceability
    trigger: >-
      Activer lorsqu'une exigence est dérivée, allouée, liée à un niveau
      supérieur/inférieur ou accompagnée d'une matrice ou d'autres traces.
    objective: >-
      Examiner les relations de dérivation et de traçabilité disponibles et
      signaler les liens manquants ou non établis.
    scope:
      includes:
        - relations de derived requirement
        - traçabilité ascendante et descendante disponible
        - analyse d'une RTM lorsqu'elle existe
      excludes:
        - création artificielle de parents
        - obligation universelle d'une RTM
    inputs:
      required: [requirements, available_traceability]
      optional: [ticket, repository_evidence, related_artifacts]
    preconditions: [requirements_or_relationships_available]
    operations:
      - inspect_derived_requirement_relations
      - inspect_traceability_paths
      - inspect_traceability_matrix_when_present
      - report_orphans_or_missing_links
    rule_refs: [ISO29148-R004, ISO29148-R005, ISO29148-R006]
    outputs: [relationship_records, traceability_findings]
    findings: [derived_requirement_relationship_missing, traceability_relationship_missing, incomplete_traceability_artifact]
    evidence_requirements: trace_source_and_target_for_each_reported_relationship
    dependencies: [SPECTRUM-SK-REQ-CONTEXT]
    relations:
      feeds: [SPECTRUM-SK-VERIFICATION, SPECTRUM-SK-VALIDATION, SPECTRUM-WF-ISO29148-READINESS]
    exit_conditions: [completed, completed_with_gaps, not_applicable]
    non_goals: [no_artificial_trace_creation, no_universal_rtm_requirement]
    evaluation_refs: [nominal, missing_context, contradictory_context, regression]

  - id: SPECTRUM-SK-VERIFICATION
    name: verification-analysis
    type: component
    role: verification
    trigger: >-
      Activer lorsqu'une exigence, un ticket ou une preuve contient ou implique
      une affirmation de vérification.
    objective: >-
      Examiner ce qui doit être vérifié et si une preuve objective pertinente est disponible.
    scope:
      includes:
        - identification de l'objet vérifié
        - examen de la preuve objective disponible
      excludes:
        - exécution automatique d'un test non requis
        - affirmation de succès sans evidence
    inputs:
      required: [requirements, available_evidence]
      optional: [tests, repository_evidence]
    preconditions: [verification_claim_or_need_identified]
    operations:
      - identify_verification_target
      - inspect_objective_evidence
      - assess_evidence_sufficiency
    rule_refs: [ISO29148-R009]
    outputs: [verification_observations, findings]
    findings: [verification_basis_unavailable]
    evidence_requirements: objective_evidence_refs_when_claimed
    dependencies: [SPECTRUM-SK-REQ-CONTEXT, SPECTRUM-SK-RELATIONSHIP-TRACEABILITY, SPECTRUM-SK-REQUIREMENT-EXPRESSION]
    relations:
      feeds: [SPECTRUM-WF-ISO29148-READINESS]
    exit_conditions: [completed, completed_with_gaps, not_applicable, blocked_on_missing_context]
    non_goals: [no_unproven_verification_claim]
    evaluation_refs: [nominal, evidence_insufficient, missing_context, regression]

  - id: SPECTRUM-SK-VALIDATION
    name: validation-analysis
    type: component
    role: validation
    trigger: >-
      Activer lorsqu'une validation est revendiquée ou lorsque l'adéquation au
      système et à l'utilisation prévue doit être établie.
    objective: >-
      Examiner la base disponible permettant de juger que l'exigence correspond
      au bon système et à l'usage prévu.
    scope:
      includes:
        - identification de la base de validation
        - examen de l'adéquation système / usage
      excludes:
        - confusion entre validation et simple contrôle de formulation
    inputs:
      required: [requirements, system_context, usage_context]
      optional: [stakeholder_context, scenario_context, evidence]
    preconditions: [validation_claim_or_need_identified]
    operations:
      - identify_validation_basis
      - inspect_system_and_usage_alignment
      - assess_validation_evidence
    rule_refs: [ISO29148-R008]
    outputs: [validation_observations, findings]
    findings: [validation_basis_unavailable]
    evidence_requirements: system_and_usage_evidence_refs_when_available
    dependencies: [SPECTRUM-SK-REQ-CONTEXT, SPECTRUM-SK-STK-SCENARIO]
    relations:
      feeds: [SPECTRUM-WF-ISO29148-READINESS]
    exit_conditions: [completed, completed_with_gaps, not_applicable, blocked_on_missing_context]
    non_goals: [no_unproven_validation_claim]
    evaluation_refs: [nominal, missing_context, evidence_insufficient, regression]

  - id: SPECTRUM-SK-RE-COVERAGE
    name: requirements-engineering-context
    type: component
    role: cross_cutting
    trigger: >-
      Activer lorsqu'il faut vérifier que l'analyse du ticket couvre les activités
      RE pertinentes et, lorsque nécessaire, le contexte de gestion dans le temps.
    objective: >-
      Identifier les activités Requirements Engineering pertinentes au ticket et
      les éventuelles lacunes de gestion du cycle de vie.
    scope:
      includes:
        - couverture contextuelle des activités RE pertinentes
        - contexte de gestion lorsque l'exigence est gérée dans le temps
      excludes:
        - imposer toutes les activités à tous les tickets
    inputs:
      required: [ticket, available_context]
      optional: [workflow_state, requirement_history]
    preconditions: [ticket_available]
    operations:
      - assess_relevant_re_activities
      - inspect_management_context_when_applicable
      - report_coverage_gaps
    rule_refs: [ISO29148-R010, ISO29148-R011]
    outputs: [re_context_assessment, findings]
    findings: [requirements_engineering_coverage_gap, requirements_management_context_gap]
    evidence_requirements: context_refs_for_each_activity_judged_relevant
    dependencies: []
    relations:
      feeds: [SPECTRUM-WF-ISO29148-READINESS]
    exit_conditions: [completed, completed_with_gaps, not_applicable]
    non_goals: [no_forced_lifecycle]
    evaluation_refs: [nominal, missing_context, not_applicable, regression]

  - id: SPECTRUM-SK-MULTI-SOURCE
    name: multi-source-context
    type: component
    role: cross_cutting
    trigger: >-
      Activer lorsqu'une conclusion sur le ticket dépend d'informations absentes
      du ticket mais potentiellement présentes dans des sources autorisées.
    objective: >-
      Rechercher et réunir le contexte autorisé avant de conclure qu'une
      information manque, tout en conservant la provenance des sources.
    scope:
      includes:
        - recherche multi-source autorisée
        - consolidation du contexte trouvé
        - provenance des informations utilisées
      excludes:
        - accès à une source non autorisée
        - transformation d'une inférence en fait
    inputs:
      required: [ticket, authorized_sources]
      optional: [repository, documentation, related_tickets, tests]
    preconditions: [authorized_sources_known]
    operations:
      - enumerate_authorized_sources
      - search_relevant_context
      - record_source_provenance
      - distinguish_found_vs_missing_information
    rule_refs: [ISO29148-R016]
    outputs: [context_package, provenance_records, findings]
    findings: [context_not_sufficiently_established]
    evidence_requirements: source_and_location_for_imported_context
    dependencies: []
    relations:
      feeds: [SPECTRUM-SK-REQ-CONTEXT, SPECTRUM-SK-STK-SCENARIO, SPECTRUM-SK-VERIFICATION, SPECTRUM-SK-VALIDATION]
    exit_conditions: [completed, completed_with_gaps, blocked_on_missing_context]
    non_goals: [no_unauthorized_source_use, no_invention]
    evaluation_refs: [nominal, missing_context, contradictory_context, regression]

  - id: SPECTRUM-SK-CONFORMANCE
    name: conformance-governance
    type: component
    role: governance
    trigger: >-
      Activer lorsqu'un résultat, une documentation ou une communication affirme
      une conformité à ISO/IEC/IEEE 29148.
    objective: >-
      Vérifier que toute affirmation de conformité possède un périmètre, un mode
      de conformité et des éléments de preuve explicitement établis.
    scope:
      includes:
        - contrôle du périmètre de l'affirmation
        - contrôle du mode de conformité revendiqué
        - contrôle de la preuve associée
      excludes:
        - déclaration de conformité par simple présence de quelques contrôles
    inputs:
      required: [conformance_claim, assessment_evidence]
      optional: [implemented_controls]
    preconditions: [conformance_claim_present]
    operations:
      - identify_claim_scope
      - identify_claim_mode
      - inspect_supporting_assessment_evidence
    rule_refs: [ISO29148-R017]
    outputs: [conformance_observation, findings]
    findings: [unsupported_conformance_claim]
    evidence_requirements: explicit_assessment_scope_and_evidence
    dependencies: []
    relations:
      validates: [SPECTRUM-WF-ISO29148-READINESS]
    exit_conditions: [completed, completed_with_gaps, not_applicable]
    non_goals: [no_formal_conformance_from_selected_controls]
    evaluation_refs: [nominal, evidence_insufficient, not_applicable, regression]

workflows:
  - id: SPECTRUM-WF-ISO29148-READINESS
    name: iso29148-ticket-readiness-analysis
    type: workflow
    objective: >-
      Orchestrer les Skills pertinents pour analyser la suffisance d'information
      d'un ticket avant implémentation sans imposer un parcours identique à tous les tickets.
    selection_inputs:
      - ticket_type
      - complexity
      - available_context
      - identified_risks
      - prior_findings
      - active_policy
    invokes:
      baseline:
        - SPECTRUM-SK-MULTI-SOURCE
        - SPECTRUM-SK-REQ-CONTEXT
      conditional:
        - SPECTRUM-SK-ELICITATION-GAP
        - SPECTRUM-SK-STK-SCENARIO
        - SPECTRUM-SK-REQUIREMENT-EXPRESSION
        - SPECTRUM-SK-RELATIONSHIP-TRACEABILITY
        - SPECTRUM-SK-VERIFICATION
        - SPECTRUM-SK-VALIDATION
        - SPECTRUM-SK-RE-COVERAGE
        - SPECTRUM-SK-CONFORMANCE
    gates:
      - required_context_established_or_explicitly_missing
      - findings_propagated
      - evidence_links_preserved
      - blocking_conditions_explicit
    outputs:
      - aggregate_findings
      - evidence_package
      - decision_inputs
    non_goals:
      - does_not_decide_READY_directly
      - does_not_invent_missing_context
      - does_not_claim_ISO_conformance
