principles:
  - id: shared_rule_definition
    statement: >-
      Les contrôles restent définis une seule fois dans rules/. Les Skills les référencent
      par identifiant et n'en créent pas une seconde définition normative.
  - id: explicit_conditionality
    statement: >-
      Les contrôles conditionnels restent conditionnels ; leur présence dans un Skill ne
      transforme pas leur applicabilité en obligation universelle.
  - id: evidence_propagation
    statement: >-
      Un finding transmis conserve les références vers les sources et evidence qui soutiennent
      l'observation ou signale explicitement leur absence.
  - id: no_forced_linear_path
    statement: >-
      Le workflow peut sélectionner ou ignorer un Skill selon le contexte ; l'architecture ne
      suppose pas que chaque ticket exige toutes les capacités.
  - id: decision_boundary
    statement: >-
      Le workflow prépare des éléments de décision mais la décision produit finale appartient
      à la couche Decision, pas au contrôle ISO lui-même.
