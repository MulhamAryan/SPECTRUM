source:
  id: incose-gtwr-v4-2023
  title: INCOSE Guide to Writing Requirements v4
  document_number: INCOSE-TP-2010-006-04
  version: 4
  revision: 4
  authority: INCOSE Requirements Working Group
  source_basis: official_incose_publication

interpretation_level: spectrum_skill_mapping

purpose: >-
  Define a traceable mapping from official INCOSE GtWR v4 characteristics,
  rules, attributes, and NRM activity relationships to SPECTRUM analytical
  Skills. Skill grouping is a SPECTRUM architecture decision; source
  relationships remain those of the official INCOSE publications.

principles:
  - official_source_before_skill_behavior
  - rules_are_not_rephrased_as_new_source_rules
  - skill_behavior_is_explicitly_derived
  - evidence_and_source_locations_are_preserved
  - no_readiness_decision_inside_a_skill

skills:
  requirement-statement-quality:
    purpose: >-
      Examiner la qualité d'une expression individuelle de besoin ou d'exigence
      au regard des caractéristiques individuelles et des règles de formulation
      du GtWR v4 qui lui sont explicitement reliées.
    characteristic_scope: [C1, C2, C3, C4, C5, C6, C7, C8, C9]
    rule_scope: [R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R15, R16, R17, R18, R19, R20, R21, R22, R23, R24, R25, R26, R27, R28, R30, R31, R32, R33, R34, R35, R36, R37, R38, R39, R40]
    not_in_scope_rules: [R29, R41, R42]
    source_basis:
      characteristics: knowledge/sources/incose-gtwr-v4-2023/characteristics.yaml
      rules: knowledge/sources/incose-gtwr-v4-2023/rules.yaml
      relationships: knowledge/sources/incose-gtwr-v4-2023/matrices.yaml
      official_matrix: "INCOSE GtWR v4 Summary Sheet page 4"
    qualification: >-
      The rule-to-characteristic matrix is the source relationship. C1 Necessary,
      C6 Feasible, and C8 Correct may require contextual or source evidence beyond
      the statement text. The Skill must return an inconclusive/context-dependent
      result rather than infer these characteristics from wording alone.
    derived_behavior_boundary: >-
      The Skill checks observable statement features and relevant contextual
      evidence against the cited INCOSE rules. It does not invent missing business
      values, approve a requirement, or claim formal compliance with INCOSE.

  requirement-set-quality:
    purpose: >-
      Examiner la qualité d'un ensemble de besoins ou d'exigences au regard des
      caractéristiques de set et des règles du GtWR v4 qui présentent une
      relation explicite avec ces caractéristiques.
    characteristic_scope: [C10, C11, C12, C13, C14, C15]
    rule_scope: [R3, R4, R26, R29, R30, R33, R34, R36, R37, R38, R39, R40, R41, R42]
    not_in_scope_rules: [R1, R2, R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R15, R16, R17, R18, R19, R20, R21, R22, R23, R24, R25, R27, R28, R31, R32, R35]
    primary_set_rules: [R29, R30, R41, R42]
    source_basis:
      characteristics: knowledge/sources/incose-gtwr-v4-2023/characteristics.yaml
      rules: knowledge/sources/incose-gtwr-v4-2023/rules.yaml
      relationships: knowledge/sources/incose-gtwr-v4-2023/matrices.yaml
      official_matrix: "INCOSE GtWR v4 Summary Sheet page 4"
      nrm_matrix: "INCOSE GtWR v4 Summary Sheet pages 5-6"
    official_relationship_scope: >-
      The rule scope is exactly the set of rules for which the official page 4
      matrix contains at least one marked C10-C15 cell. A rule is included only
      because of those marked set cells; no additional relationship is inferred
      from its name or quality-focus category.
    qualification: >-
      C10-C15 are characteristics of sets. C12 Feasible and C15 Correct require
      contextual or source evidence beyond cross-member wording inspection. C14
      requires a validation basis appropriate to the type of set. The Skill must
      return an inconclusive/context-dependent result where that evidence is
      insufficient.
    derived_behavior_boundary: >-
      The Skill compares supplied set members, structure, terminology,
      relationships, constraints, traceability, and supporting evidence against
      the cited INCOSE relationships. The grouping of these checks into one Skill
      is a SPECTRUM architecture decision, not an INCOSE rule.
    relevant_nrm_activity_scope:
      - "3.2.1.3 Managing Sets of Needs And Requirements"
      - "3.2.2.1 Analysis from Which Needs and Requirements are Derived"
      - "3.2.2.2 Completeness"
      - "3.2.2.3 Consistency"
      - "3.2.2.4 Identity and Manage Interdependencies"
      - "4.4.3 Get Stakeholder Agreement"
      - "4.4.4 Completeness"
      - "4.6.2.3 Organizing the Integrated Set of Needs"
      - "4.6.3.3 Completeness of the Integrated Set of Needs"
      - "4.6.3.4 Needs Feasibility and Risk"
      - "6.2.1.1 Organizing Sets of Design Input Requirements"
      - "6.2.2 Establish Traceability"
      - "6.2.6.2 Completeness, Correctness, and Consistency"
      - "6.2.6.3 Requirements Feasibility and Risk"
      - "6.3 Baseline and Manage Design Input Requirements"
      - "6.4.3 Allocation – Flow Down of Requirements"
      - "6.4.5 Budgeting of Performance, Resource, and Quality Requirements"
      - "6.4.7 Use of Traceability and Allocation to Manage Requirements"
      - "7.2.2 Perform Design Input Requirements Validation"
      - "8.5 Design Validation"
      - "14.2.7 Combine Allocation and Traceability to Manage Requirements"
      - "14.2.8 Managing Interfaces"

  requirements-context:
    purpose: >-
      Établir et analyser les éléments de contexte et les preuves nécessaires
      pour interpréter et évaluer correctement un besoin ou une exigence sans
      inventer de faits de projet.
    characteristic_scope: [C1, C2, C3, C4, C6, C7, C8, C9]
    rule_scope: []
    attribute_scope: [A1, A2, A3, A4, A12]
    source_activity_scope:
      - "3.2.1.6 Formal, Binding Agreement"
      - "3.2.2.1 Analysis from Which Needs and Requirements are Derived"
      - "3.2.2.4 Identity and Manage Interdependencies"
      - "4.3.3 Identify External and Internal Stakeholders"
      - "4.3.6.2 Technology Maturity"
      - "4.3.7.1 Classes of Risk - Development Risk"
      - "4.4.3 Get Stakeholder Agreement"
      - "4.5 Lifecycle Concepts Analysis and Maturation"
      - "4.5.1 Feasibility"
      - "4.5.4 Levels of Detail and Abstraction"
      - "4.6.3.1 Managing Unknowns"
      - "4.6.3.2 Appropriate to Level"
      - "4.6.3.4 Needs Feasibility and Risk"
      - "4.8 Baseline & Manage Lifecycle Concepts & Needs Definition Outputs"
      - "5.1.2 Perform Needs Verification"
      - "5.2.2 Perform Needs Validation"
      - "6.2 Perform Design Input Requirements Definition"
      - "6.2.1.5 Managing Unknowns"
      - "6.2.2 Establish Traceability"
      - "6.2.3.6 Interface Requirements Audit"
      - "6.2.6.2 Completeness, Correctness, and Consistency"
      - "6.2.6.3 Requirements Feasibility and Risk"
      - "7.2.2 Perform Design Input Requirements Validation"
      - "14.2.4 Managing Unknowns"
      - "14.2.8 Managing Interfaces"
      - "14.2.9 Managing System Verification and System Validation"
    source_basis:
      definitions: knowledge/sources/incose-gtwr-v4-2023/definitions.yaml
      characteristics: knowledge/sources/incose-gtwr-v4-2023/characteristics.yaml
      attributes: knowledge/sources/incose-gtwr-v4-2023/attributes.yaml
      relationships: knowledge/sources/incose-gtwr-v4-2023/matrices.yaml
      official_source: "INCOSE GtWR v4 Summary Sheet pages 1-7"
    qualification: >-
      This Skill is a SPECTRUM context/evidence capability. INCOSE does not
      define a Skill named requirements-context. The listed characteristics,
      attributes, and NRM activities are source relationships used to constrain
      the Skill. No additional rule or characteristic is created.
    evidence_boundary: >-
      Attributes listed here are source attributes from the official GtWR
      inventory; the Summary Sheet states that attribute definitions are in the
      NRM. The Skill checks whether relevant project evidence exists and is
      attributable; it does not make every listed attribute mandatory in every
      project or context.
    derived_behavior_boundary: >-
      The Skill identifies context needed for reliable downstream analysis,
      preserves evidence dependencies, and reports missing or conflicting
      context. It does not infer business facts, certify INCOSE conformity, or
      decide implementation readiness.

source_discrepancy:
  id: R14-label
  canonical_rule_identity: Correct Punctuation
  conflicting_matrix_label: Correct Condition
  handling: preserve_as_official_source_inconsistency
