version: 2
name: spectrum-documentation-pipeline
purpose: >-
  Define the single reporting pipeline used by /spectrum:document-feature. This
  pipeline is independent from models/reporting-pipeline.yaml (used exclusively
  by /spectrum:analyze-ticket and its review-* subsets) and never renders a
  ticket-readiness report or vice versa.

independence:
  from: models/reporting-pipeline.yaml
  rule: >-
    This file does not modify, extend, or compete with reporting-pipeline.yaml.
    /spectrum:document-feature never produces a Decision, never runs
    workflows/ticket-analysis.yaml, and is never invoked as part of
    /spectrum:analyze-ticket.

principles:
  one_documentation_pipeline: true
  documentation_is_a_composition_not_a_decision: true
  documentation_composer_is_renderer: true
  no_reanalysis_during_render: true
  no_architecture_invention_during_render: true
  user_output_in_report_language: true   # default fr, set by --lang
  narrative_first: true                  # prose document, not an element-by-element table
  no_synthetic_short_ids: true           # elements are named by their real identifier, never AE-/AV-/AD-/D-/T-/Q-/L- codes
  no_traceability_annex_table: true      # evidence stays attached to the underlying TechnicalDocumentation object, not rendered as a body-to-ref mapping
  traceability_preserved_internally: true

input_contract:
  required:
    - command_id
    - documentation_id
    - feature_ref
    - source_refs
    - evidence_refs
    - provenance
  conditional:
    architecture_view_refs: required_when_architecture_evidence_available
    architecture_element_refs: required_when_architecture_evidence_available
    technical_decision_refs: required_when_decision_evidence_available
    verification_scenario_refs: required_when_verification_evidence_available
    test_scenario_refs: required_when_test_evidence_available
    diagram_artifact_refs: required_when_diagram_derivation_available

normalization:
  source: canonical_technical_documentation
  operations:
    - resolve_references
    - preserve_provenance
    - select_narrative_relevant_elements_for_body_rest_goes_to_appendix
    - deduplicate_elements_already_described_at_a_previous_level
    - resolve_display_labels_to_real_identifiers
    - map_machine_statuses_to_plain_language_in_report_language
    - validate_required_sections
    - validate_every_body_statement_remains_evidence_attributable_internally
  forbidden:
    - infer_missing_architecture_element
    - infer_missing_design_element
    - create_new_finding
    - create_new_architecture_decision_record
    - invent_rationale_when_undocumented
    - invent_test_scenario
    - recalculate_any_decision
    - alter_source_evidence
    - restate_an_element_already_covered_at_a_previous_documentation_level

rendering:
  renderer: documentation-composer
  output_contract: outputs/technical-documentation-report.yaml
  language: report_language   # from workflow input, default fr
  machine_values: hidden_in_body
  identifiers_in_body: real_identifiers_only   # class/component/file/endpoint name — no synthetic short-id scheme
  technical_ids: internal_only   # canonical ids, execution_id, stage ids never rendered in the document
  source_quotes: preserve_only_when_already_provided_and_authorized
  target_format: >-
    Confluence-ready structured Markdown, written as prose a person would
    write. This pipeline produces the document content only; it never
    publishes to Confluence or any external system.

common_sections:
  required:
    - Resume
    - Architecture
    - Verification_et_tests
    - Limites_connues
  conditional:
    - Decisions_techniques
    - Points_attention
    - Questions_ouvertes
    - Diagrammes
    - Annexe_inventaire   # collapsed/optional, never the primary content

validation:
  before_render:
    - all_required_inputs_resolved_or_explicitly_unavailable
    - every_architecture_element_has_evidence_or_explicit_uncertain_status
    - every_architecture_decision_record_has_rationale_status
    - every_displayed_test_has_requirement_or_observed_behavior_basis_or_is_marked_not_derivable
  after_render:
    - output_body_is_entirely_in_report_language
    - no_machine_status_is_exposed
    - no_synthetic_short_id_or_traceability_annex_in_body
    - no_sources_consultees_or_permission_securite_section
    - body_does_not_repeat_appendix_inventory_content
    - no_numeric_quality_score_is_added
    - no_readiness_or_decision_verdict_is_rendered
    - every_body_statement_remains_internally_evidence_attributable

failure_behavior:
  unresolved_reference: report_generation_blocked_with_reason
  invalid_input: report_generation_blocked_with_reason
  validation_failure: do_not_render_as_success

security:
  mode: read_only_by_default
  rendering_does_not_authorize_mutation: true
  external_write_requires_explicit_user_permission: true
  no_automatic_confluence_publication: true
  blocked_action_disclosure: single_sentence_where_relevant_not_a_dedicated_section
