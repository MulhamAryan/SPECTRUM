model: spectrum-canonical-data-model

skill_bindings:
  requirement-statement-quality:
    targets: [Requirement]
    produces: [Observation, Finding]
  requirement-set-quality:
    targets: [RequirementSet]
    produces: [Observation, Finding]
  requirements-context:
    targets: [Requirement, RequirementSet, Context]
    consumes: [Source, SourceFragment, Evidence, Stakeholder, Entity, Constraint, Scenario, BusinessRule]
    produces: [Observation, Finding, Context]
  requirement-relationship-traceability:
    targets: [Requirement, RequirementSet, Relationship]
    consumes: [Source, Evidence, Attribute, BusinessRule]
    produces: [Observation, Finding, Relationship]
  verification-analysis:
    targets: [Requirement, RequirementSet]
    consumes: [Scenario, Constraint, Evidence, Attribute, Artifact, BusinessRule]
    produces: [Observation, Finding]
  validation-analysis:
    targets: [RequirementSet]
    consumes: [Stakeholder, Scenario, Context, Evidence, Attribute, Artifact, BusinessRule]
    produces: [Observation, Finding]
  requirements-attribute-management:
    targets: [Requirement, RequirementSet, Attribute]
    consumes: [Source, Evidence, Context]
    produces: [Observation, Finding, Attribute]
  baseline-change-management:
    targets: [Requirement, RequirementSet, Baseline, Change]
    consumes: [Attribute, Evidence, Artifact, Relationship]
    produces: [Observation, Finding, Baseline, Change]
  business-rule-analysis:
    model: spectrum-business-rule-analysis
    targets: [BusinessRule, Requirement, RequirementSet, Scenario, Constraint, Artifact]
    consumes: [Source, SourceFragment, Evidence, Context, Constraint, Scenario, Relationship, Attribute, Baseline, Change]
    produces: [BusinessRule, Observation, Finding, Evidence]
  adversarial-requirement-analysis:
    model: spectrum-adversarial-requirement-analysis
    targets: [Requirement, RequirementSet, BusinessRule, Constraint, Scenario, Artifact]
    consumes: [BusinessRule, Source, SourceFragment, Evidence, Context, Scenario, Constraint, Relationship, Attribute, Baseline, Change]
    produces: [Challenge, Observation, Finding, Evidence]
  spec-implementation-drift-analysis:
    model: spectrum-spec-implementation-drift-analysis
    targets: [Requirement, RequirementSet, BusinessRule, Constraint, Scenario, Artifact]
    consumes: [Source, SourceFragment, Evidence, Context, Relationship, Baseline, Change, Attribute]
    produces: [DriftAssessment, Observation, Finding, Evidence]
  cross-artifact-analysis:
    model: spectrum-cross-artifact-analysis
    targets: [Ticket, Requirement, RequirementSet, Artifact, Baseline, Change, BusinessRule, Challenge, DriftAssessment]
    consumes: [Source, SourceFragment, Evidence, Context, Constraint, Scenario, Relationship, Attribute, BusinessRule, Challenge, DriftAssessment]
    produces: [Observation, Finding, Evidence]

analysis_engine:
  model: spectrum-analysis-engine
  consumes: [Ticket, Requirement, RequirementSet, BusinessRule, Source, SourceFragment, Evidence, Context, Constraint, Scenario, Stakeholder, Entity, Relationship, Attribute, Baseline, Change, Artifact, Challenge, DriftAssessment]
  orchestrates: [SkillExecution]
  produces: [Observation, Finding, Evidence]
  result: AnalysisResult
  decision_boundary: no_global_readiness_decision

multi_source_reasoning:
  model: spectrum-multi-source-reasoning
  consumes: [Source, SourceFragment, Evidence, Observation, Context, Requirement, RequirementSet, BusinessRule, Challenge, DriftAssessment]
  produces: [Evidence, Observation, Finding, Relationship, SourceResolution]
  decision_boundary: no_global_readiness_decision

finding_engine:
  model: spectrum-finding-engine
  consumes: [Observation, Evidence, Finding, Relationship, Requirement, RequirementSet, BusinessRule, Challenge, DriftAssessment, Context, Source, SourceFragment]
  produces: [Finding, FindingAggregationResult]
  decision_boundary: no_global_readiness_decision

decision_engine:
  model: spectrum-decision-engine
  consumes: [AnalysisResult, Finding, Evidence]
  requires: [DecisionPolicy]
  produces: [Decision, DecisionEvaluation]
  decision_boundary: policy_defined_outcome_only

ticket_readiness_engine:
  model: spectrum-ticket-readiness-engine
  consumes: [AnalysisResult, Finding, Evidence, Context, Requirement, RequirementSet, BusinessRule, DriftAssessment]
  requires: [ReadinessPolicy]
  policy_ref: policies/ticket-readiness-v1.yaml
  delegates_generic_decision_semantics_to: spectrum-decision-engine
  produces: [ReadinessEvaluation, Decision]
  decision_boundary: explicit_readiness_policy_only

workflows:
  ticket-analysis:
    model: ticket-analysis
    version: 5
    consumes: [Ticket, Source, SourceFragment, Artifact, Evidence, BusinessRule]
    orchestrates: [Context, Requirement, RequirementSet, BusinessRule, Challenge, DriftAssessment, SkillExecution, AnalysisResult, FindingAggregationResult, ReadinessEvaluation, Decision]
    decision_boundary: readiness_only_after_explicit_policy_evaluation

pipeline_roles:
  source_ingestion: [Source, SourceFragment, Artifact]
  contextualization: [Context, Stakeholder, Entity, Constraint, Scenario]
  requirement_representation: [Need, Requirement, RequirementSet, Attribute, Relationship]
  business_rule_representation: [BusinessRule, Relationship, Attribute]
  adversarial_analysis: [Challenge, Observation, Finding, Evidence]
  specification_implementation_drift_analysis: [DriftAssessment, Observation, Finding, Evidence]
  analytical_execution: [SkillExecution, Observation]
  cross_artifact_analysis: [Comparison, Observation, Finding, Evidence, Relationship]
  multi_source_reasoning: [SourceObservation, Comparison, SourceResolution]
  issue_aggregation: [Finding, FindingAggregationResult]
  policy_decision: [Decision, DecisionEvaluation]
  ticket_readiness: [ReadinessEvaluation, Decision]
  handoff: [Artifact]

boundary:
  - Skills do not own Decision creation semantics.
  - Evidence remains attributable to its source or declared project origin.
  - Canonical model does not imply that every object or attribute is mandatory for every ticket.
  - Analysis Engine orchestrates Skill executions but does not redefine Skill semantics.
  - Business Rule Analysis establishes and assesses explicit domain rules but does not redefine requirements or readiness semantics.
  - Adversarial Requirement Analysis challenges declared requirements and context without treating hypothetical scenarios as project facts or creating readiness decisions.
  - Specification Implementation Drift Analysis compares supplied specification and implementation artifacts without inventing runtime behavior or creating readiness decisions.
  - Cross-Artifact Analysis compares declared inputs and produces analytical results without rewriting source artifacts or creating readiness decisions.
  - Multi-Source Reasoning preserves source identity, contradiction, authority, scope, and temporal distinctions.
  - Finding Engine consolidates findings without changing source facts, deleting contradictions, or creating readiness decisions.
  - Decision Engine applies only explicit versioned policy semantics and does not invent outcomes.
  - Ticket Readiness Engine does not redefine generic Decision Engine semantics; it supplies readiness-specific policy and dimensions.
  - Ticket readiness is a SPECTRUM decision policy, not an INCOSE characteristic, rule, or automatic consequence of analysis coverage.
  - Workflows orchestrate existing models and engines; they do not redefine source semantics or Skill contracts.
