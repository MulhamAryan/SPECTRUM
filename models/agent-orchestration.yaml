version: 2
name: agent-orchestration
purpose: >-
  Principles, routing conditions and failure policy for SPECTRUM specialized
  agents. This model NO LONGER defines an execution graph: the graph (stages,
  agents, phases, dependencies, parallel groups, profiles) lives exclusively in
  workflows/ticket-analysis.yaml and is executed following
  core/orchestration-procedure.md.

principles:
  orchestrator_is_the_slash_command_in_main_conversation: true
  there_is_no_supervisor_agent: true
  agent_is_execution_boundary: true
  skill_is_atomic_analysis_unit: true
  parallel_only_when_dependencies_are_satisfied: true
  failed_execution_remains_visible: true
  no_silent_result_loss: true
  no_agent_global_readiness: true
  no_external_mutation: true
  every_agent_result_is_schema_validated: true

invocation:
  mechanism: Task
  invoked_by: orchestrator
  required_context:
    - analysis_id
    - profile
    - stage_ids
    - target_refs
    - source_refs
    - available_artifact_refs
    - required_upstream_results_only
    - report_language
  required_agent_behavior:
    - load_core_agent_brief
    - load_each_selected_skill_before_use
    - follow_skill_procedure
    - return_single_yaml_block_conforming_to_agent_execution_result_schema
    - preserve_evidence_and_finding_refs
  isolation:
    independent-reviewer:
      receives_no_conclusion_from_other_agents: true
      comparison_is_done_by_orchestrator_after_return: true

execution_result:
  schema: models/agent-execution-result.schema.json
  allowed_statuses:
    - completed
    - completed_with_findings
    - completed_with_gaps
    - blocked
    - failed
    - not_applicable

routing:
  context-analyst:
    required_when: [always]
  requirement-analyst:
    required_when: [always]
  verification-validation-analyst:
    required_when: [profile_is_standard_or_full]
  lifecycle-change-analyst:
    required_when: [profile_is_standard_or_full, lifecycle_or_change_context_applicable]
  business-rule-analyst:
    required_when: [profile_is_standard_or_full]
  adversarial-analyst:
    required_when: [always]
  consistency-analyst:
    required_when: [two_or_more_comparable_artifacts_available]
  implementation-reviewer:
    required_when: [implementation_artifacts_available]
  independent-reviewer:
    required_when: [profile_is_full, independent_analysis_requested, workflow_policy_requires_second_opinion]
  qa-analyst:
    required_when: [always]
  report-composer:
    required_when: [always]

handoffs:
  explicit_only: true
  record:
    - source_execution_id
    - target_agent_or_skill
    - reason
    - input_refs
    - evidence_refs

failure_policy:
  on_agent_failure: preserve_failure_and_continue_independent_branches
  on_required_agent_failure: mark_downstream_stage_blocked_when_dependency_is_material
  on_skill_failure: do_not_simulate_success
  on_missing_context: emit_gap_or_blocked_status
  on_non_conforming_agent_output: mark_failed_and_keep_raw_output

completion:
  ready_for_report_only_when:
    - all_material_selected_agents_have_returned
    - all_required_skill_failures_are_recorded
    - all_handoffs_are_recorded
    - all_findings_and_evidence_are_traceable
    - readiness_decision_exists_or_its_absence_is_explained
