model:
  id: spectrum-finding-model
  version: 1
  interpretation_level: spectrum_architecture
  purpose: >-
    Define the canonical analytical finding structure used to consolidate
    observations and evidence without turning findings into readiness decisions.

Finding:
  required:
    - id
    - finding_type
    - target_refs
    - status
  fields:
    id: stable identifier
    finding_type: issue | gap | contradiction | positive_observation | uncertainty
    target_refs: canonical objects concerned by the finding
    severity: informational | low | medium | high | critical | unknown
    status: open | resolved | accepted | deferred | inconclusive
    observation_refs: observations from which the finding is derived
    evidence_refs: evidence supporting or qualifying the finding
    source_refs: authoritative or project sources relevant to the finding
    rationale: concise analytical explanation
    resolution_refs: evidence or artifacts resolving the finding
    provenance: origin, method, recorded_at, recorded_by

FindingRules:
  - finding_requires_at_least_one_target
  - finding_requires_observation_or_evidence_basis
  - finding_does_not_equal_decision
  - severity_is_not_readiness
  - inconclusive_findings_preserve_uncertainty
  - contradiction_findings_preserve_conflicting_evidence
  - resolution_requires_attributable_evidence
  - source_authority_is_not_inferred_from_finding_severity

FindingDerivation:
  input_layers:
    - observation
    - evidence
    - source_reference
    - canonical_object
  output:
    - finding
  constraints:
    - derived_claims_retain_input_references
    - no_new_source_fact_is_created
    - no_global_readiness_status_is_created

FindingTypes:
  issue:
    meaning: A detected condition requiring attention or analysis.
  gap:
    meaning: Required or applicable information, relation, evidence, or condition not established by available inputs.
  contradiction:
    meaning: Two or more attributable inputs cannot be reconciled by the current analysis.
  positive_observation:
    meaning: An explicitly supported condition relevant to the analysis without implying overall readiness.
  uncertainty:
    meaning: The available evidence is insufficient or conflicting to establish the target condition.

Boundary:
  INCOSE: >-
    INCOSE characteristics, rules, attributes, and activity references remain
    source-backed inputs when used by a finding; this model does not define new
    INCOSE rules or characteristics.
  SPECTRUM: >-
    Finding types, statuses, severity vocabulary, derivation semantics, and
    separation from decisions are SPECTRUM architecture.
  decision_layer: >-
    A Finding must not contain READY, NOT_READY, PASS, FAIL, or equivalent
    global ticket-readiness decisions. Those semantics belong to explicit
    decision policy and workflow layers.
