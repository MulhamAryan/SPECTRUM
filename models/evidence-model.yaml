model:
  id: spectrum-evidence-model
  version: 1
  interpretation_level: spectrum_architecture
  purpose: >-
    Define the canonical evidence structure used to preserve attributable
    information and its relation to observations and findings.

Evidence:
  required: [id, type, evidence_kind, subject_refs]
  fields:
    id: stable identifier
    type: canonical object type
    evidence_kind: source_fact | project_fact | project_artifact | observation_input | derived_observation | contradiction | absence
    subject_refs: canonical objects concerned by the evidence
    source_refs: originating sources when applicable
    fragment_refs: addressable source fragments
    observation_refs: observations directly associated with the evidence
    supports_refs: observations or findings supported
    contradicts_refs: observations or findings contradicted
    provenance: origin, method, recorded_at, recorded_by
    extraction_status: available | partial | conflicting | unavailable

SourceFragment:
  required: [id, type, source_ref, locator]
  fields: [id, type, source_ref, locator, extracted_text, extraction_method]

EvidenceRules:
  - source_fact_requires_source_reference
  - project_fact_requires_declared_project_origin
  - project_artifact_requires_artifact_reference
  - derived_evidence_requires_input_references
  - absence_is_not_proof_of_nonconformity
  - contradiction_is_preserved_not_silently_resolved
  - evidence_does_not_equal_observation
  - evidence_does_not_equal_finding
  - evidence_does_not_equal_decision
  - confidence_does_not_replace_provenance

Boundary:
  canonical_alignment: >-
    Evidence kinds and references must remain compatible with the canonical
    data model. Source provenance is conditional on evidence origin rather than
    being invented for project-origin evidence.
  decision_layer: >-
    Evidence provides attributable basis but never creates a readiness or other
    policy decision by itself.
