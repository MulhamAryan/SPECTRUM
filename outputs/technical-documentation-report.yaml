report:
  id: technical-documentation-report
  version: 2
  language: report_language (default fr)
  purpose: >-
    Define the Confluence-ready technical document produced by
    /spectrum:document-feature after post-implementation analysis.
    Narrative-first: the body reads like a normal technical documentation
    page written by a person, explaining what was implemented and why.
    Exhaustive per-element inventories are optional, collapsed annex
    content — never the primary presentation. Independent of
    outputs/ticket-analysis-report.yaml: this contract never renders a
    readiness verdict and is never produced by /spectrum:analyze-ticket.

presentation:
  identifiers_in_body: none
  rule: >-
    Elements, decisions, and limitations are named in prose by their real
    identifier (class/component/file/endpoint name) — never by a synthetic
    short-id scheme (no AE-/AV-/AD-/D-/T-/Q-/L- codes) and never backed by a
    separate traceability-annex mapping table. Evidence references
    (canonical object ids, execution_id, stage, evidence excerpts) remain
    attached to the underlying TechnicalDocumentation object for audit
    purposes but are not rendered in the document body or as a visible annex
    table.
  narrative_vs_catalogue: >-
    An element, relationship, or design detail is named in the body only
    when it is referenced by a view, a decision, an attention point, a
    limitation, or is otherwise necessary to understand the feature's shape.
    Everything else that was established but does not meet this bar is
    available only in the optional appendix_inventory section — it is never
    padding in the main sections. architecture-analyst/design-documentation-analyst
    establish the full technical inventory as data; this presentation layer,
    informed by TechnicalDocumentation.*.narrative_relevant, decides what
    surfaces in prose.

sections:
  summary:
    required: true
    purpose: >-
      What the feature does, for whom, and what was actually analyzed
      (ticket-driven or reconstructed from implementation alone).
    rule: 3-6 sentences, prose. No per-element listing here.

  architecture:
    required: true
    purpose: >-
      Narrative description of how the feature is structured end to end —
      the components involved, how they call each other, and why that shape
      exists — written as prose/short paragraphs organized around the
      established views, not a per-element table.
    rule: >-
      Name only elements that matter to understanding the design (narrative_relevant).
      Mark explicitly, in prose, anything whose status is derived/inferred/unknown
      rather than directly observed.

  technical_decisions:
    required: false
    purpose: real, evidence-backed architecture/design decisions and their rationale.
    rule: >-
      no_fabricated_rationale; a decision without an explicitly documented
      rationale says so in plain language ("justification déduite de
      l'implémentation, aucune justification explicite trouvée"), never a
      fabricated-sounding rationale.

  attention_points:
    required: false
    purpose: >-
      Contradictions, risks, or unresolved divergences between what the
      project declares (rules, existing documentation, ticket intent) and
      what was actually observed in the implementation. This is the
      analytically significant content of the document and should read as
      such, not be buried among routine facts.
    rule: every point here is evidence-backed, never invented or exaggerated.

  verification_and_tests:
    required: true
    purpose: >-
      What test evidence exists for the feature, in prose, or an explicit
      statement that none was found.
    rule: >-
      tests_are_derived_not_invented; absence of test evidence is reported
      as absence, never qualified as a defect without a dedicated analysis.

  known_limitations:
    required: true
    purpose: gaps, unresolved scope, or unverifiable claims, as a short list.
    rule: every limitation traces to a finding, gap, or explicit unassessed scope.

  open_questions:
    required: false
    purpose: actionable questions for the project team, each tied to an attention point or limitation above.
    rule: questions must be actionable; no question without a concrete owner or related point.

  appendix_inventory:
    required: false
    presentation: collapsed_or_clearly_separated_from_body
    purpose: >-
      Full per-element/per-file catalogue for readers who want it (e.g. a
      collapsible "Annexe — inventaire technique" block). Never required
      reading to understand the feature; never duplicated into the main
      sections above.

non_goals:
  - no readiness verdict or score
  - no synthetic short-id scheme or traceability-annex table in the rendered document
  - no "Sources consultées" section listing raw file paths or describing the pipeline's own internal consolidation process
  - no "Permission et sécurité" boilerplate section — a blocked write/publication action, if one actually occurred, is a single sentence placed where relevant, not a dedicated section
  - no invented architecture element, design element, decision rationale, or test case
  - no duplicate re-listing of the same elements across the architecture and design sections — design content adds only what architecture did not already establish
  - no replacement of the canonical TechnicalDocumentation, Evidence, or Finding models
  - no automatic publication to Confluence or any external system
