workflow:
  id: ticket-analysis
  version: 3
  interpretation_level: spectrum_workflow
  purpose: >-
    Orchestrate end-to-end analysis of a software-development ticket from source
    ingestion and canonicalization through scoped analytical Skills, cross-artifact
    analysis, multi-source reasoning, finding consolidation, and explicit
    ticket-readiness decision evaluation.

inputs:
  required:
    - ticket
  optional:
    - project_sources
    - project_artifacts
    - analysis_profile
    - readiness_policy_ref
  provenance: required

stages:
  - id: ingest
    purpose: establish ticket, source, artifact, and provenance inputs
    produces: [Ticket, Source, SourceFragment, Artifact, Evidence]
    failure_behavior: preserve_inputs_and_stop_dependent_stages

  - id: contextualize
    purpose: establish explicit context, stakeholders, entities, constraints, scenarios, and relevant relationships
    depends_on: [ingest]
    skills: [requirements-context, requirement-relationship-traceability]
    produces: [Context, Stakeholder, Entity, Constraint, Scenario, Relationship, Observation, Finding]

  - id: represent_requirements
    purpose: represent needs, requirements, requirement sets, and applicable attributes
    depends_on: [contextualize]
    skills: [requirement-relationship-traceability, requirements-attribute-management, requirement-set-quality]
    produces: [Requirement, RequirementSet, Attribute, Relationship, Observation, Finding]

  - id: analyze_requirements
    purpose: execute statement and set quality analysis
    depends_on: [represent_requirements]
    skills: [requirement-statement-quality, requirement-set-quality]
    produces: [Observation, Finding, Evidence]

  - id: analyze_verification_validation
    purpose: analyze verification basis and validation context where applicable
    depends_on: [represent_requirements]
    skills: [verification-analysis, validation-analysis]
    produces: [Observation, Finding, Evidence]

  - id: analyze_lifecycle_change
    purpose: analyze baseline and change information when lifecycle/change context is applicable
    depends_on: [represent_requirements]
    skills: [baseline-change-management]
    produces: [Observation, Finding, Baseline, Change]

  - id: analyze_cross_artifacts
    purpose: compare declared ticket and project artifacts to detect cross-artifact alignment gaps, mismatches, contradictions, and unresolved correspondences
    depends_on:
      - represent_requirements
      - analyze_requirements
      - analyze_verification_validation
      - analyze_lifecycle_change
    skills: [cross-artifact-analysis]
    produces: [Observation, Finding, Evidence]

  - id: multi_source_reasoning
    purpose: compare and reconcile information from multiple attributable sources while preserving conflicts and uncertainty
    depends_on:
      - represent_requirements
      - analyze_requirements
      - analyze_verification_validation
      - analyze_lifecycle_change
      - analyze_cross_artifacts
    engine: spectrum-multi-source-reasoning
    produces: [Evidence, Observation, Finding, Relationship, SourceResolution]

  - id: consolidate_findings
    purpose: group and consolidate analytical findings without erasing provenance, contradictions, or uncertainty
    depends_on:
      - analyze_requirements
      - analyze_verification_validation
      - analyze_lifecycle_change
      - analyze_cross_artifacts
      - multi_source_reasoning
    engine: spectrum-finding-engine
    produces: [Finding, FindingAggregationResult]

  - id: consolidate
    purpose: produce a complete AnalysisResult while preserving evidence, findings, uncertainty, and coverage
    depends_on: [consolidate_findings]
    engine: spectrum-analysis-engine
    produces: [AnalysisResult]

  - id: decide_readiness
    purpose: apply the explicit ticket-readiness policy to the completed analytical result
    depends_on: [consolidate]
    requires: [readiness_policy_ref]
    engine: spectrum-ticket-readiness-engine
    produces: [DecisionEvaluation, Decision]

execution_model:
  orchestration: dependency_graph
  parallelizable_groups:
    - [analyze_requirements, analyze_verification_validation, analyze_lifecycle_change]
  rules:
    - dependencies_must_resolve_before_execution
    - independent_stages_may_execute_in_parallel
    - cross_artifact_analysis_runs_after_requirement_context_and_scoped_analyses
    - stage_failure_does_not_erase_prior_outputs
    - blocked_dependency_propagates_blocked_or_partial_state
    - every_stage_records_execution_and_provenance
    - no_stage_invents_missing_project_facts

state_semantics:
  workflow_status:
    - not_started
    - running
    - completed
    - partial
    - blocked
    - failed
  rules:
    - workflow_status_is_execution_state_not_readiness_outcome
    - readiness_decision_is_created_only_in_decide_readiness
    - partial_or_blocked_analysis_does_not_become_ready_without_policy_permission

handoffs:
  required:
    - ingest_to_contextualize
    - contextualize_to_represent_requirements
    - represent_requirements_to_analysis_skills
    - analysis_skills_to_cross_artifact_analysis
    - cross_artifact_analysis_to_multi_source_reasoning
    - multi_source_reasoning_to_consolidate_findings
    - findings_to_consolidate
    - consolidate_to_decide_readiness
  rule: >-
    Each handoff identifies producer, consumer, input references, provenance,
    and any coverage, contradiction, failure, or uncertainty limitations.

failure_paths:
  missing_ticket: blocked
  missing_required_source_context: partial_or_blocked
  unavailable_skill: blocked_or_partial_with_reason
  skill_failure: continue_independent_stages_and_preserve_failure
  cross_artifact_failure: continue_with_preserved_inputs_and_mark_cross_artifact_coverage_partial
  multi_source_failure: continue_with_preserved_inputs_and_mark_finding_coverage_partial
  finding_engine_failure: analysis_result_blocked_or_partial_without_erasing_prior_findings
  analysis_failure: no_readiness_decision_unless_policy_explicitly_allows_terminal_non_success_input
  readiness_policy_error: failed_without_fallback_decision

outputs:
  primary:
    - AnalysisResult
    - DecisionEvaluation
    - Decision
  supporting:
    - Observation
    - Finding
    - Evidence
    - Context
    - Relationship
    - SourceResolution
    - Baseline
    - Change
  traceability: required

boundaries:
  Skills: >-
    Skills perform scoped analysis and produce observations/findings; they do not
    orchestrate the workflow or create the readiness decision.
  CrossArtifactAnalysis: >-
    Cross-Artifact Analysis compares declared inputs, preserves artifact identity,
    and reports analytical correspondences or divergences. It does not rewrite
    artifacts, invent mappings, or create readiness decisions.
  MultiSourceReasoning: >-
    Multi-source reasoning compares attributable inputs and preserves source-aware
    contradictions and uncertainty; internal comparison objects do not become canonical entities.
  FindingEngine: >-
    Finding Engine consolidates analytical findings and preserves their supporting
    observations and evidence; it does not create source facts or readiness decisions.
  AnalysisEngine: >-
    Analysis Engine orchestrates analytical execution and produces AnalysisResult;
    it does not define readiness semantics.
  DecisionEngine: >-
    Generic Decision Engine semantics govern explicit policy evaluation and
    decision traceability.
  TicketReadinessEngine: >-
    Ticket Readiness Engine supplies readiness-specific dimensions, blocking
    semantics, and policy-driven outcome handling.
  Sources: >-
    Source content remains attributable evidence and does not become SPECTRUM
    policy merely by being ingested.
